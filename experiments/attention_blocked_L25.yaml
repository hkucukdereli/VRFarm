last_saved: "2026-04-08"
# Expert. Days 11+. Multi-location blocked.
# Level 2.5 (adaptive), 4 deg stim, multiple contrasts.
# Switch trials: first trial of each new block uses lowest contrast.

# ── What to show ──
stimulus:
  background_gray: 0.75
  size_deg: 4.0
  duration_s: 2.0
  altitude_deg: 10.0
  go_rule: all
  contrast:
    values: [0.25, 0.15, 0.125]
    proportions: [0.34, 0.33, 0.33]
  switch_trial_contrast: lowest

# ── When to reward ──
reward:
  amount_ul: 4.0
  level: 2.5
  reward_delay_s: 0.6
  response_window: 1.4
  timeout_rule: rate
  max_lick_rate: 0.3

# ── Trial structure ──
session:
  n_blocks: 6
  block_size: 25
  block_sequence: [80, -40, 40, -80, 80, -40]
  iti: [4, 16]
  prestim_duration: 0
  poststim_duration: 0
  global_delay: 0
  block_delay: 0
  block_delay_skip_first: false

# ── Adaptive (level 2.5 only) ──
adaptive:
  enabled: true
  initial_state: 0.0
  step_up: 0.2
  step_down: 0.2
