# TEMPLATE — display_calibration/<rig>/intensity/contrast_cal_<YYYYmmdd_HHMM>.yaml
# Light vs drive level at ONE spot, from Setup → INTENSITY → Contrast Cal. A rig uses one via
# Setup → INTENSITY → Use + Save Rig (rig YAML devices.display.contrast_calibration); contrast
# values are then MEASURED luminance contrast. Levels 1.0 and 0.0 (the black floor) are
# required; units cancel. See docs/CALIBRATION_PROTOCOL.md.
timestamp: '2026-01-01T12:00:00'
kind: contrast
source: setup-ui
method: manual
patch:
  shape: square
  bg_gray: 0
  apply_lum: false
  az_deg: 0
  alt_deg: 20
  size_deg: 15
measurements:
- level: 1.0
  reading: 233.0
- level: 0.5
  reading: 50.0
- level: 0.1
  reading: 2.4
- level: 0.0
  reading: 0.85
note: reading = meter value at the patch for each drive level; level 0.0 is the black floor. Units cancel (only ratios are used).
