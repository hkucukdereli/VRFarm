# attention_random.yaml
#
# Random-location attention task. Post-expert.
#
# 150 trials, 2 locations (+80, -80), randomly assigned per trial.
# Level 2.5, 4 deg stim, contrasts [0.25, 0.15, 0.125] in 33/33/33.
# No block structure — locations are fully randomized.

paradigm: attention
version: 1

states:
  iti:
    duration:
      random: [4, 16]
    events:
      lick:
        - condition: "lick_count > max_licks"
          action: restart_iti
    on_timeout: stimulus

  stimulus:
    duration: 0.6
    entry_actions:
      - show_stim
    events:
      lick:
        - condition: "level == 1 and not rewarded"
          action: deliver_reward
    on_timeout: response_window

  response_window:
    duration: 1.4
    entry_actions:
      - auto_reward
    events:
      lick:
        - condition: "level == 3 and is_go and not rewarded"
          action: deliver_reward
          transition: outcome
    on_timeout: outcome

  outcome:
    duration: 0.5
    entry_actions:
      - record_trial
    on_timeout: iti

stimulus:
  size_deg: 4.0
  duration_s: 2.0
  altitude_deg: 10.0
  go_rule: all
  contrast:
    values: [0.25, 0.15, 0.125]
    proportions: [0.34, 0.33, 0.33]

timing:
  reward_delay_s: 0.6

session:
  n_trials: 150
  block_size: 1
  block_sequence: [80, -80]
  randomize_blocks: true

levels:
  2.5:
    description: "Adaptive - probabilistic L2/L3 per trial"

adaptive:
  enabled: true
  initial_state: 0.0
  step_up: 0.2
  step_down: 0.2

devices:
  lick_sensor:
    max_lick_rate: 0.3
  reward:
    amount_ul: 4.0
  display:
    background_gray: 0.5
