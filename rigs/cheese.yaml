data:
  leader_dir: /home/vruser/data
  video_dir: /home/vruser/data
devices:
  camera:
    auto_exposure: false
    bitrate_mbps: 12
    enabled: true
    exposure_ms: 10
    fps: 50
    gain: 2.0
    live_preset: high
    resolution:
    - 1280
    - 720
    type: camera
  display:
    apply_warp: true
    enabled: true
    geometry_file: rig_geometry.yaml
    refresh_hz: 60
    resolution:
    - 1920
    - 1080
    type: display
  encoder:
    enabled: true
    i2c_address: '0x36'
    i2c_bus: 1
    sample_hz: 500
    type: encoder
    wheel_diameter_cm: 14.4
  lick_sensor:
    electrode: 4
    enabled: true
    i2c_address: '0x5A'
    type: lick_sensor
  photodiode:
    debounce_enabled: true
    debounce_ms: 5
    enabled: true
    glitch_enabled: true
    glitch_ms: 0.5
    gpio: 16
    pulse_every_n_frames: 5
    sync_corner: top-right
    sync_size_px: 150
    sync_brightness: 1.0
    type: photodiode
  reward:
    calibration:
      main:
      - - 10
        - 4
    enabled: true
    pins:
      home:
        gpio: 24
        label: home
      main:
        gpio: 23
        label: reward
    reward_type: sucrose
    type: reward
grace_period_s: 10
name: cheddar
slack:
  enabled: false
  webhook_url: ''
network:
  api_port: 5080
  camera_port: 5001
  command_port: 5572
  display_port: 5575
  event_port: 5571
pis:
- devices:
  - lick_sensor
  - reward
  - photodiode
  - camera
  - encoder
  ip: 192.168.10.101
  name: cheddar
  role: leader
  user: vruser
- devices:
  - display
  ip: 192.168.10.102
  name: mozzarella
  role: follower
  user: vruser
