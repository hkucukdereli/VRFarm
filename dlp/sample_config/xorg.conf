# /etc/X11/xorg.conf for the FOLLOWER (DLP projector Pi), trixie.
# Forces the DRM "modesetting" driver so X binds to the DPI output (enumerates as
# DSI-1 under FKMS) at the 1920x1080 DPI mode, instead of a fbdev/dummy screen that
# never reaches the projector. Proven on the working follower; Install copies this
# to /etc/X11/xorg.conf. Pair with config_dlp.txt (FKMS + DPI) and a console boot
# (multi-user.target) so start_projector.sh owns display :0.

Section "Device"
    Identifier "drm"
    Driver "modesetting"
EndSection

Section "Screen"
    Identifier "Default Screen"
    Device "drm"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
    EndSubSection
EndSection
