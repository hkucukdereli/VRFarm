last_saved: "2026-04-08"
# Go/No-Go v2. 3 training levels.
# Go = left (negative azimuth), NoGo = right (positive azimuth).

# ── What to show ──
stimulus:
  background_gray: 0.5
  size_deg: 8.0
  shape: square
  duration_s: 2.0
  altitude_deg: 49.0
  go_rule: left
  contrast:
    values: [0.25]
    proportions: [1.0]

# ── When to reward ──
reward:
  amount_ul: 4.0
  amount_mode: volume
  amount_count: 1
  pulse_gap_ms: 150
  level: 2
  reward_delay_s: 0.6
  response_window: 1.4
  pav_delay_s: 0
  timeout_rule: rate
  max_lick_rate: 0.3
  timeout_phases: [iti]

# ── Trial structure ──
session:
  n_blocks: 6
  block_size: 25
  block_sequence: [-40, 40, -40, 40, -40, 40]
  iti: [5, 12]
  prestim_duration: 0
  poststim_duration: 0
  global_delay: 0
  block_delay: 0
  block_delay_skip_first: false

# ── Adaptive (level 2.5 only) ──
adaptive:
  enabled: false
