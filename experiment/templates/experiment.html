<!DOCTYPE html><html><head>
<meta charset="utf-8"><title>VRFarm — Experiment</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'SF Mono',Consolas,monospace; background:#111827;
       color:#e0e0e0; font-size:13px; height:100vh; overflow:hidden; }
.topbar { background:#0d1117; border-bottom:1px solid #374151; padding:8px 16px;
          display:flex; align-items:center; gap:12px; height:44px; }
.topbar h1 { font-size:15px; color:#60a5fa; }
.session-id { color:#6b7280; font-size:11px; }
.badge { padding:3px 8px; border-radius:10px; font-size:10px; font-weight:bold; text-transform:uppercase; }
.st-setup     { background:#1f2937; color:#6b7280; }
.st-connected { background:#14532d; color:#4ade80; }
.st-ready     { background:#1e3a5f; color:#60a5fa; }
.st-running   { background:#7f1d1d; color:#f87171; }
.st-ended     { background:#451a03; color:#fbbf24; }
.indrow { margin-left:auto; display:flex; gap:10px; align-items:center; font-size:11px; }
.ind { display:inline-block; width:9px; height:9px; border-radius:50%;
       background:#374151; margin-right:4px; }
.ind-ok  { background:#4ade80; }
.ind-run { background:#f87171; animation:blink .5s infinite alternate; }
@keyframes blink { from{opacity:1} to{opacity:.3} }

.layout { display:grid; grid-template-columns:300px 1fr; height:calc(100vh - 44px); }
.sidebar { background:#1f2937; border-right:1px solid #374151; overflow-y:auto;
           padding:12px; display:flex; flex-direction:column; gap:10px; }
.main { overflow-y:auto; padding:12px; display:flex; flex-wrap:wrap;
        gap:12px; align-content:flex-start; }

.card { background:#111827; border:1px solid #374151; border-radius:6px; padding:12px; }
.card h3 { font-size:10px; text-transform:uppercase; color:#60a5fa;
           letter-spacing:1px; margin-bottom:8px; }
.btn { padding:6px 12px; border:none; border-radius:4px; cursor:pointer;
       font-family:inherit; font-size:12px; font-weight:bold; }
.btn:hover { opacity:.85; } .btn:disabled { opacity:.35; cursor:not-allowed; }
.btn-blue  { background:#2563eb; color:#fff; }
.btn-green { background:#16a34a; color:#fff; }
.btn-red   { background:#dc2626; color:#fff; }
.btn-amber { background:#d97706; color:#fff; }
.btn-gray  { background:#374151; color:#ccc; }
.btn-block { width:100%; margin-top:6px; }
.btn-row   { display:flex; gap:6px; flex-wrap:wrap; }

label.lbl { font-size:11px; color:#9ca3af; display:block; margin-bottom:2px; }
input, select, textarea {
  background:#0d1117; border:1px solid #374151; color:#e0e0e0;
  padding:5px 8px; border-radius:4px; font-family:inherit; font-size:12px;
}
input[type=text], input[type=number], select { width:100%; }
textarea { width:100%; resize:vertical; font-size:11px; }
.row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; }
.chk-row { display:flex; align-items:center; gap:6px; margin:4px 0;
           font-size:12px; }
.chk-row input[type=checkbox] { width:auto; }

.stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.stat { background:#0d1117; border:1px solid #374151; border-radius:4px;
        padding:8px; text-align:center; }
.stat-val { font-size:22px; font-weight:bold; color:#60a5fa; }
.stat-lbl { font-size:10px; color:#6b7280; text-transform:uppercase; }

.log-box { font-size:11px; font-family:monospace; max-height:150px;
           overflow-y:auto; }
.log-box div { padding:1px 0; border-bottom:1px solid #1f2937; }
.lc-ok    { color:#4ade80; }
.lc-err   { color:#f87171; }
.lc-warn  { color:#fbbf24; }
.lc-info  { color:#6b7280; }
.lc-lick  { color:#60a5fa; }
.lc-reward{ color:#4ade80; }
.lc-stim  { color:#fbbf24; }

.sep { border:none; border-top:1px solid #374151; margin:8px 0; }
.event-monitor { background:#0d1117; border:1px solid #374151; border-radius:4px;
                 margin-top:6px; max-height:120px; overflow-y:auto; padding:4px 8px; }
.event-list { font-size:10px; font-family:monospace; }
.event-list div { padding:1px 0; color:#9ca3af; }
.event-list .ev-lick { color:#60a5fa; }
.event-list .ev-pd   { color:#fbbf24; }

/* ── Hardware monitor boxes ──────────────────────────────────────────────── */
.hw-box { background:#111827; border:1px solid #374151; border-radius:6px;
          width:calc(50% - 6px); min-width:320px; flex:1 1 calc(50% - 6px);
          display:flex; flex-direction:column; }
.hw-box.hw-disabled { opacity:.3; pointer-events:none; }
.hw-box-hdr { display:flex; align-items:center; padding:8px 12px;
              border-bottom:1px solid #374151; gap:8px; }
.hw-box-hdr h4 { font-size:10px; text-transform:uppercase; color:#60a5fa;
                  letter-spacing:1px; flex:1; margin:0; }
.hw-box-hdr .live-chk { display:flex; align-items:center; gap:4px;
                         font-size:10px; color:#9ca3af; }
.hw-box-hdr .live-chk input { width:auto; }
.hw-box-hdr .live-dot { width:7px; height:7px; border-radius:50%;
                         background:#374151; display:inline-block; }
.hw-box-hdr .live-dot.on { background:#f87171; animation:blink .5s infinite alternate; }
.hw-box-body { padding:12px; flex:1; overflow-y:auto; max-height:280px; }
.hw-box-body .raster-wrap { background:#0a0f18; border-radius:4px;
                             height:100px; position:relative; margin-top:6px; }
.hw-box-body .raster-wrap canvas { width:100%; height:100%; }
.hw-box-body .trial-log { font-size:11px; font-family:monospace;
                           max-height:100px; overflow-y:auto; margin-top:6px; }
.hw-box-body .trial-log div { padding:1px 0; border-bottom:1px solid #1f2937; }
.hw-box-body .stim-preview { background:#000; border-radius:4px; height:120px;
                              display:flex; align-items:center; justify-content:center;
                              margin-top:6px; overflow:hidden; }
.hw-box-body .stim-preview img { max-height:100%; max-width:100%; object-fit:contain; }
.cam-placeholder { color:#374151; font-size:11px; text-align:center; }
</style>
</head><body>

<div class="topbar">
  <h1>VRFarm</h1>
  <span class="session-id" id="sid">—</span>
  <span class="badge st-setup" id="state-badge">setup</span>
  <div class="indrow">
    <span><span class="ind" id="ind-stim"></span>stim</span>
    <span><span class="ind" id="ind-ctrl"></span>control</span>
    <span id="stim-ind" style="display:none;color:#fbbf24;font-size:11px">STIM ON</span>
    <span id="rew-ind"  style="display:none;color:#4ade80;font-size:11px">REWARD</span>
  </div>
</div>

<div class="layout">
<div class="sidebar">

  <!-- Rig selector -->
  <div class="card">
    <h3>Rig</h3>
    <div class="btn-row" style="align-items:center">
      <select id="rig-select" style="flex:1" onchange="onRigChange(this.value)">
        <option value="">— select rig —</option>
      </select>
      <button class="btn btn-gray" style="padding:5px 8px"
              onclick="document.getElementById('rig-file-load').click()"
              title="Load rig JSON file">Load</button>
      <input type="file" id="rig-file-load" accept=".json" style="display:none"
             onchange="loadRigFile(event)">
    </div>
    <input type="text" id="rig-path-box" readonly
           style="margin-top:4px;font-size:11px;color:#6b7280;width:100%"
           value="" placeholder="no rig loaded">
  </div>

  <!-- Experiment config -->
  <div class="card">
    <h3>Experiment</h3>
    <label class="lbl">Config file</label>
    <input type="text" id="cfg-path" placeholder="config/HK001_day07.yaml"
           value="{{ config_path }}">
    <div class="btn-row" style="margin-top:6px">
      <button class="btn btn-blue" style="flex:1" onclick="loadCfg()">Load</button>
      <button class="btn btn-gray" style="flex:1" onclick="saveCfg()">Save</button>
    </div>
    <!-- Editable params (hidden until config loaded) -->
    <div id="exp-params" style="display:none;margin-top:10px">
      <div id="cfg-loaded-msg" style="font-size:11px;color:#4ade80;margin-bottom:8px"></div>
      <hr class="sep">
      <div class="row2">
        <div><label class="lbl">Subject</label>
          <input type="text" id="exp-subject" onchange="updateExp()"
                 placeholder="HK001"></div>
        <div><label class="lbl">Level</label>
          <input type="number" id="exp-level" min="1" onchange="updateExp()"></div>
      </div>
      <div class="row3" style="margin-top:4px">
        <div><label class="lbl">Date (yyyymmdd)</label>
          <input type="text" id="exp-date" onchange="updateExp()"
                 maxlength="8" placeholder="20260401"></div>
        <div><label class="lbl">Session #</label>
          <input type="number" id="exp-sessnum" min="1" onchange="updateExp()"></div>
        <div style="display:flex;align-items:flex-end">
          <span id="exp-sessid" style="font-size:10px;color:#6b7280;padding:5px 0"></span>
        </div>
      </div>
      <div class="row2" style="margin-top:4px">
        <div><label class="lbl">Trials</label>
          <input type="number" id="exp-ntrials" min="1" onchange="updateExp()"></div>
        <div><label class="lbl">Block size</label>
          <input type="number" id="exp-blocksize" min="1" onchange="updateExp()"></div>
      </div>
      <div style="margin-top:4px">
        <label class="lbl">Block sequence (az deg, comma-sep)</label>
        <input type="text" id="exp-blockseq" onchange="updateExp()">
      </div>
      <hr class="sep">
      <div class="row3" style="margin-top:4px">
        <div><label class="lbl">ITI min (s)</label>
          <input type="number" id="exp-itimin" step="0.5" min="0" onchange="updateExp()"></div>
        <div><label class="lbl">ITI max (s)</label>
          <input type="number" id="exp-itimax" step="0.5" min="0" onchange="updateExp()"></div>
        <div><label class="lbl">Resp window (s)</label>
          <input type="number" id="exp-respwin" step="0.5" min="0.5" onchange="updateExp()"></div>
      </div>
      <div class="row2" style="margin-top:4px">
        <div>
          <label class="lbl">Adaptive</label>
          <div class="chk-row" style="margin:0">
            <input type="checkbox" id="exp-adaptive" onchange="updateExp()">
            <label style="font-size:11px">Enabled</label>
          </div>
        </div>
      </div>
      <div id="exp-adaptive-opts" class="row2" style="margin-top:4px;display:none">
        <div><label class="lbl">Step up</label>
          <input type="number" id="exp-stepup" step="0.05" min="0" onchange="updateExp()"></div>
        <div><label class="lbl">Step down</label>
          <input type="number" id="exp-stepdn" step="0.05" min="0" onchange="updateExp()"></div>
      </div>
      <div style="margin-top:4px">
        <label class="lbl">Notes</label>
        <input type="text" id="exp-notes" onchange="updateExp()">
      </div>
    </div>
  </div>

  <!-- Connections -->
  <div class="card" id="conn-card" style="display:none">
    <h3>Connections</h3>
    <div id="conn-table"></div>
    <button class="btn btn-blue btn-block" id="btn-init-all"
            onclick="initializeAll()" style="margin-top:8px">Initialize All</button>
  </div>

  <!-- Hardware selection -->
  <div class="card" id="hw-card" style="display:none">
    <h3>Hardware</h3>
    <div class="chk-row">
      <input type="checkbox" id="hw-stim" onchange="updateHW()" checked>
      <label>Stimulus (PsychoPy)</label>
    </div>
    <div class="chk-row">
      <input type="checkbox" id="hw-reward" onchange="updateHW()" checked>
      <label>Reward (solenoid)</label>
    </div>
    <div class="chk-row">
      <input type="checkbox" id="hw-licks" onchange="onHwLickChange()" checked>
      <label>Lick sensor (MPR121)</label>
    </div>
    <div class="chk-row">
      <input type="checkbox" id="hw-camera" onchange="onHwCameraChange()">
      <label>Camera</label>
    </div>
    <div id="hw-camera-opts" style="display:none;padding-left:20px;margin-top:4px">
      <div class="row2">
        <div><label class="lbl">Resolution</label>
          <select id="hw-cam-res" onchange="updateHW()">
            <option value="1280,720">1280x720</option>
            <option value="640,480">640x480</option>
            <option value="1920,1080">1920x1080</option>
          </select></div>
        <div><label class="lbl">FPS</label>
          <input type="number" id="hw-cam-fps" value="50" min="1" max="120"
                 onchange="updateHW()"></div>
      </div>
    </div>
    <div class="chk-row">
      <input type="checkbox" id="hw-photodiode" onchange="updateHW()">
      <label>Photodiode</label>
    </div>
    <div id="hw-pd-opts" style="display:none;padding-left:20px;margin-top:4px">
      <div class="row2">
        <div><label class="lbl">GPIO pin</label>
          <input type="number" id="hw-pd-gpio" value="24" onchange="updateHW()"></div>
        <div><label class="lbl">Pulse every N frames</label>
          <input type="number" id="hw-pd-n" value="5" onchange="updateHW()"></div>
      </div>
    </div>
    <button class="btn btn-green btn-block" id="btn-load-hw"
            onclick="loadHardware()" disabled>Load Hardware</button>
  </div>

  <!-- Stats -->
  <div class="card" id="stats-card" style="display:none">
    <h3>Session Stats</h3>
    <div class="stat-grid">
      <div class="stat"><div class="stat-val" id="st-trials">0</div>
        <div class="stat-lbl">Trials</div></div>
      <div class="stat"><div class="stat-val" id="st-hr">—</div>
        <div class="stat-lbl">Hit rate</div></div>
      <div class="stat"><div class="stat-val" id="st-block">—</div>
        <div class="stat-lbl">Block</div></div>
      <div class="stat"><div class="stat-val" id="st-adapt">—</div>
        <div class="stat-lbl">Adaptive</div></div>
    </div>
  </div>

  <!-- Actions -->
  <div class="card">
    <h3>Session Control</h3>
    <button class="btn btn-green btn-block" id="btn-go"
            onclick="goExperiment()" disabled>&#9654; GO</button>
    <button class="btn btn-amber btn-block" id="btn-end"
            onclick="endSession()" disabled style="margin-top:6px">&#9632; End Session</button>
    <button class="btn btn-blue btn-block" id="btn-transfer"
            onclick="transferData()" disabled style="margin-top:6px">
      &#8595; End &amp; Transfer Data</button>
  </div>

  <!-- Log -->
  <div class="card" style="flex:1">
    <h3>Log</h3>
    <div class="log-box" id="log-box"></div>
  </div>

</div>

<!-- MAIN: hardware monitor boxes -->
<div class="main" id="hw-monitors">

  <!-- 1. Stimulus -->
  <div class="hw-box hw-disabled" id="box-stim">
    <div class="hw-box-hdr">
      <h4>Stimulus</h4>
      <div class="live-chk">
        <span class="live-dot" id="live-dot-stim"></span>
        <input type="checkbox" id="live-stim" onchange="onLiveToggle('stim')">
        <label>Live</label>
      </div>
    </div>
    <div class="hw-box-body">
      <div class="row3" style="margin-top:4px">
        <div><label class="lbl">Size (deg)</label>
          <input type="number" id="exp-size" step="0.5" min="0.5" onchange="updateExp()"></div>
        <div><label class="lbl">Duration (s)</label>
          <input type="number" id="exp-dur" step="0.1" min="0.1" onchange="updateExp()"></div>
        <div><label class="lbl">Altitude (deg)</label>
          <input type="number" id="exp-alt" step="1" onchange="updateExp()"></div>
      </div>
      <div class="row2" style="margin-top:4px">
        <div><label class="lbl">Background gray</label>
          <input type="number" id="exp-bg" step="0.1" min="-1" max="1" onchange="updateExp()"></div>
      </div>
      <div style="margin-top:4px">
        <label class="lbl">Contrast values (comma-sep)</label>
        <input type="text" id="exp-contrast" onchange="updateExp()">
      </div>
      <div style="margin-top:4px">
        <label class="lbl">Contrast proportions (comma-sep)</label>
        <input type="text" id="exp-cprobs" onchange="updateExp()">
      </div>
      <hr class="sep">
      <div class="btn-row">
        <button class="btn btn-blue" style="flex:1" id="btn-gen-stims"
                onclick="generateStims()">Generate Stims</button>
        <select id="stim-select" style="flex:1" onchange="previewStim()">
          <option value="">— no stims —</option>
        </select>
      </div>
      <div id="stim-trial-info" style="font-size:11px;color:#9ca3af;margin-top:6px"></div>
      <div class="stim-preview" id="stim-preview-area">
        <span class="cam-placeholder">No stimulus loaded</span>
      </div>
    </div>
  </div>

  <!-- 2. Reward -->
  <div class="hw-box hw-disabled" id="box-reward">
    <div class="hw-box-hdr">
      <h4>Reward</h4>
      <div class="live-chk">
        <span class="live-dot" id="live-dot-reward"></span>
        <input type="checkbox" id="live-reward" onchange="onLiveToggle('reward')">
        <label>Live</label>
      </div>
    </div>
    <div class="hw-box-body">
      <div id="reward-info" style="font-size:12px;color:#e0e0e0;margin-bottom:6px"></div>
      <div class="row2" style="margin-top:4px">
        <div><label class="lbl">Amount (ul)</label>
          <input type="number" id="test-reward-ul" value="4" step="0.5" min="0.5"
                 onchange="updateRewardInfo()" oninput="updateRewardInfo()"></div>
        <div><label class="lbl">Delay (s)</label>
          <input type="number" id="exp-rewdelay" step="0.1" min="0" onchange="updateExp()"></div>
      </div>
      <button class="btn btn-green" onclick="deliverReward()" id="btn-reward"
              disabled style="margin-top:4px;width:100%">Deliver</button>
      <div id="reward-trial-log" class="trial-log" style="margin-top:8px"></div>
      <div id="reward-summary" style="font-size:11px;color:#9ca3af;margin-top:4px"></div>
    </div>
  </div>

  <!-- 3. Lick Monitor -->
  <div class="hw-box hw-disabled" id="box-lick">
    <div class="hw-box-hdr">
      <h4>Lick Monitor</h4>
      <div class="live-chk">
        <span class="live-dot" id="live-dot-lick"></span>
        <input type="checkbox" id="live-lick" onchange="onLiveToggle('lick')">
        <label>Live</label>
      </div>
    </div>
    <div class="hw-box-body">
      <div class="row2" style="margin-bottom:6px">
        <div><label class="lbl">Max lick rate (/s)</label>
          <input type="number" id="exp-maxlick" step="0.05" min="0" onchange="updateExp()"></div>
        <div style="display:flex;align-items:flex-end">
          <button class="btn btn-gray" style="flex:1" id="btn-check-lick"
                  onclick="checkLickSensor()">Check Sensor</button>
        </div>
      </div>
      <button class="btn btn-gray btn-block" id="btn-monitor-lick"
              onclick="toggleLickMonitor()">Monitor Licks</button>
      <div id="lick-counter" style="font-size:11px;color:#9ca3af;margin-top:6px">
        Licks: 0</div>
      <div class="raster-wrap">
        <canvas id="lick-raster"></canvas>
      </div>
      <div id="lick-event-list" class="event-list event-monitor" style="display:none;margin-top:4px"></div>
    </div>
  </div>

  <!-- 4. Camera -->
  <div class="hw-box hw-disabled" id="box-camera">
    <div class="hw-box-hdr">
      <h4>Camera</h4>
      <div class="live-chk">
        <span class="live-dot" id="live-dot-camera"></span>
        <input type="checkbox" id="live-camera" onchange="onLiveToggle('camera')">
        <label>Live</label>
      </div>
    </div>
    <div class="hw-box-body">
      <button class="btn btn-gray btn-block" id="btn-check-cam"
              onclick="toggleCameraStream()">Check Camera</button>
      <div style="background:#000;border-radius:4px;height:150px;margin-top:6px;
                  display:flex;align-items:center;justify-content:center" id="cam-area">
        <span class="cam-placeholder" id="cam-off-msg">Camera not connected</span>
        <img id="cam-stream" style="display:none;max-height:100%;max-width:100%;object-fit:contain" alt="camera">
      </div>
    </div>
  </div>

  <!-- 5. Photodiode -->
  <div class="hw-box hw-disabled" id="box-photodiode">
    <div class="hw-box-hdr">
      <h4>Photodiode</h4>
      <div class="live-chk">
        <span class="live-dot" id="live-dot-photodiode"></span>
        <input type="checkbox" id="live-photodiode" onchange="onLiveToggle('photodiode')">
        <label>Live</label>
      </div>
    </div>
    <div class="hw-box-body">
      <button class="btn btn-gray" style="width:100%" id="btn-monitor-pd"
              onclick="togglePhotodiodeMonitor()">Monitor Photodiode</button>
      <div class="raster-wrap">
        <canvas id="pd-raster"></canvas>
      </div>
      <div id="pd-event-list" class="event-list event-monitor" style="display:none;margin-top:4px"></div>
    </div>
  </div>

</div>
</div>

<script>
// ── State ────────────────────────────────────────────────────────────────────
let lickTimes = [], pdTimes = [], trialCount = 0, hitCount = 0;
let lickMonitorOn = false, pdMonitorOn = false, camStreamOn = false;
let controlConnected = false;
let pendingLickCheck = false, pendingCameraCheck = false;
let currentRigName = '';
let piList = [];
let allInitialized = false;
let currentState = 'setup';
let rewardDelivered = 0, rewardMissed = 0;
let lickCountSession = 0;
let hwLoaded = false;  // whether Load Hardware has been clicked

// Livestream state per box
const liveState = { stim:false, reward:false, lick:false, camera:false, photodiode:false };

// ── Rig selector ─────────────────────────────────────────────────────────────

function refreshRigList(selectName) {
  fetch('/api/rigs').then(r => r.json()).then(d => {
    const sel = document.getElementById('rig-select');
    sel.innerHTML = '<option value="">— select rig —</option>';
    (d.rigs || []).forEach(name => {
      const opt = document.createElement('option');
      opt.value = name; opt.textContent = name;
      if (name === selectName) opt.selected = true;
      sel.appendChild(opt);
    });
    if (selectName) onRigChange(selectName);
  });
}

function onRigChange(name) {
  currentRigName = name || '';
  const pathBox = document.getElementById('rig-path-box');
  if (name) {
    pathBox.value = `/config/rig_${name}.json`;
    addLog(`Rig selected: ${name}`, 'lc-ok');
  } else {
    pathBox.value = '';
    pathBox.placeholder = 'no rig loaded';
  }
}

function loadRigFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      const name = data.name || file.name.replace(/^rig_/, '').replace(/\.json$/, '');
      const clean = name.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
      if (!clean) { addLog('Could not determine rig name from file', 'lc-err'); return; }
      currentRigName = clean;
      document.getElementById('rig-path-box').value = `/config/rig_${clean}.json`;
      const sel = document.getElementById('rig-select');
      let found = false;
      for (const opt of sel.options) { if (opt.value === clean) { opt.selected = true; found = true; break; } }
      if (!found) {
        const opt = document.createElement('option');
        opt.value = clean; opt.textContent = clean; opt.selected = true;
        sel.appendChild(opt);
      }
      addLog(`Rig loaded from file: ${clean}`, 'lc-ok');
    } catch (err) {
      addLog('Invalid JSON: ' + err.message, 'lc-err');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ── SSE ──────────────────────────────────────────────────────────────────────
const es = new EventSource('/stream');
es.onmessage = e => handle(JSON.parse(e.data));

function handle(d) {
  if      (d.type === 'state')  updateState(d.state);
  else if (d.type === 'conn')   updateConn(d);
  else if (d.type === 'trial')  updateTrial(d);
  else if (d.type === 'lick')   handleLick(d);
  else if (d.type === 'sync_pulse') handleSyncPulse(d);
  else if (d.type === 'check_lick_ok') {
    addLog('Lick sensor OK','lc-ok');
    pendingLickCheck = false;
  }
  else if (d.type === 'check_lick_fail') {
    addLog('Lick sensor FAILED: '+(d.error||'unknown'),'lc-err');
    pendingLickCheck = false;
    document.getElementById('hw-licks').checked = false;
    updateHW();
  }
  else if (d.type === 'check_camera_ok') {
    addLog('Camera OK','lc-ok');
    pendingCameraCheck = false;
  }
  else if (d.type === 'check_camera_fail') {
    addLog('Camera FAILED: '+(d.error||'unknown'),'lc-err');
    pendingCameraCheck = false;
    document.getElementById('hw-camera').checked = false;
    updateHW();
  }
  else if (d.type === 'stim')   setInd('stim-ind', d.on);
  else if (d.type === 'reward') { setInd('rew-ind', d.on); if(d.on) addLog('reward delivered','lc-reward'); }
  else if (d.type === 'log')    addLog(d.msg, {ok:'lc-ok',err:'lc-err',warn:'lc-warn',info:'lc-info'}[d.cls]||'lc-info')
  else if (d.type === 'config') onConfig(d);
  else if (d.type === 'session_id_update') {
    document.getElementById('sid').textContent = d.session_id || '—';
    document.getElementById('exp-sessid').textContent = d.session_id || '';
    if (d.session_num) document.getElementById('exp-sessnum').value = d.session_num;
  }
}

function handleLick(d) {
  lickTimes.push(d.t);
  lickCountSession++;
  if (liveState.lick) {
    drawLickRaster();
    document.getElementById('lick-counter').textContent = `Licks: ${lickCountSession}`;
    addEventEntry('lick-event-list','ev-lick',
      fmtTime(d.t)+' lick');
  }
}

function handleSyncPulse(d) {
  pdTimes.push(d.t);
  if (liveState.photodiode) {
    drawPdRaster();
    addEventEntry('pd-event-list','ev-pd',
      fmtTime(d.t)+' TTL #'+d.pulse_idx);
  }
}

function fmtTime(t) {
  return new Date(t*1000).toLocaleTimeString()+'.'+
    String(Math.floor(t%1*1000)).padStart(3,'0');
}

function updateState(s) {
  currentState = s;
  const b = document.getElementById('state-badge');
  b.textContent = s; b.className = 'badge st-' + s;
  document.getElementById('btn-go').disabled       = s !== 'ready';
  document.getElementById('btn-end').disabled      = s !== 'running';
  document.getElementById('btn-transfer').disabled = !['running','ready'].includes(s);
  // Load Hardware button: disabled only when running
  document.getElementById('btn-load-hw').disabled = (s === 'running') || !hwLoaded && s === 'setup';
  // Stats visible once running
  if (s === 'running') document.getElementById('stats-card').style.display = '';
  // Update live dots based on state
  updateLiveDots();
}

function updateConn(d) {
  const id = d.role === 'stim' ? 'ind-stim' : 'ind-ctrl';
  document.getElementById(id).className = 'ind ind-ok';
  if (d.ok) {
    const pi = piList.find(p => p.role === d.role);
    if (pi) pi.connected = true;
    renderConnTable();
    if (d.role === 'control') {
      controlConnected = true;
      document.getElementById('btn-reward').disabled = false;
    }
    if (piList.length && piList.every(p => p.connected)) {
      allInitialized = true;
      renderInitAllBtn();
    }
  }
}

function updateTrial(d) {
  trialCount++; if(d.outcome==='hit') hitCount++;
  document.getElementById('st-trials').textContent = trialCount;
  document.getElementById('st-hr').textContent     = Math.round(hitCount/trialCount*100)+'%';
  if (d.block_num !== undefined)
    document.getElementById('st-block').textContent = d.block_num+1;
  if (d.adaptive_state !== undefined && d.adaptive_state !== null)
    document.getElementById('st-adapt').textContent = parseFloat(d.adaptive_state).toFixed(1);
  const cls = d.outcome==='hit'?'lc-reward':d.outcome==='miss'?'lc-err':'lc-warn';
  addLog(`T${trialCount}: ${d.outcome} az=${d.stim_az}° c=${d.contrast}`, cls);

  // Reward box: per-trial outcome
  if (liveState.reward) {
    const rewLog = document.getElementById('reward-trial-log');
    const div = document.createElement('div');
    if (d.outcome === 'hit') {
      rewardDelivered++;
      div.style.color = '#4ade80';
      div.textContent = `Trial ${trialCount}: reward delivered`;
    } else {
      rewardMissed++;
      div.style.color = '#f87171';
      div.textContent = `Trial ${trialCount}: reward missed (${d.outcome})`;
    }
    rewLog.prepend(div);
    if (rewLog.children.length > 50) rewLog.removeChild(rewLog.lastChild);
    document.getElementById('reward-summary').textContent =
      `Delivered: ${rewardDelivered} | Missed: ${rewardMissed}`;
  }

  // Stimulus box: show trial stim info
  if (liveState.stim) {
    document.getElementById('stim-trial-info').textContent =
      `Trial ${trialCount}: az=${d.stim_az}° contrast=${d.contrast}`;
    // Try to load thumbnail
    const img = document.querySelector('#stim-preview-area img');
    if (img) {
      img.src = `/api/stim_thumbnail?trial=${trialCount-1}`;
      img.style.display = '';
      const ph = document.querySelector('#stim-preview-area .cam-placeholder');
      if (ph) ph.style.display = 'none';
    }
  }
}

function setInd(id, on) {
  document.getElementById(id).style.display = on ? '' : 'none';
}

function onConfig(d) {
  document.getElementById('sid').textContent = d.session_id || '—';
  document.getElementById('exp-params').style.display = '';
  document.getElementById('cfg-loaded-msg').textContent =
    `Loaded — ${d.session_id}`;
  // Populate editable fields
  document.getElementById('exp-subject').value = d.subject_id || '';
  document.getElementById('exp-date').value = d.date || '';
  document.getElementById('exp-sessnum').value = d.session_num || 1;
  document.getElementById('exp-sessid').textContent = d.session_id || '';
  document.getElementById('exp-level').value = d.level || 1;
  document.getElementById('exp-ntrials').value = d.n_trials || 100;
  document.getElementById('exp-blocksize').value = d.block_size || 25;
  document.getElementById('exp-blockseq').value = (d.block_sequence || []).join(', ');
  document.getElementById('exp-size').value = d.size_deg || 8;
  document.getElementById('exp-dur').value = d.duration_s || 2;
  document.getElementById('exp-alt').value = d.altitude_deg || 10;
  document.getElementById('exp-bg').value = d.background_gray != null ? d.background_gray : 0;
  document.getElementById('exp-maxlick').value = d.max_lick_rate || 0.3;
  document.getElementById('exp-contrast').value = (d.contrast_values || []).join(', ');
  document.getElementById('exp-cprobs').value = (d.contrast_probs || []).join(', ');
  document.getElementById('exp-itimin').value = d.iti_min || 8;
  document.getElementById('exp-itimax').value = d.iti_max || 16;
  document.getElementById('exp-respwin').value = d.response_window_s || 6.5;
  document.getElementById('exp-rewdelay').value = d.reward_delay_s || 0.6;
  document.getElementById('exp-adaptive').checked = !!d.adaptive_enabled;
  document.getElementById('exp-adaptive-opts').style.display = d.adaptive_enabled ? '' : 'none';
  document.getElementById('exp-stepup').value = d.adaptive_step_up || 0.2;
  document.getElementById('exp-stepdn').value = d.adaptive_step_down || 0.2;
  document.getElementById('exp-notes').value = d.notes || '';
  // Show sidebar cards
  document.getElementById('hw-card').style.display = '';
  document.getElementById('conn-card').style.display = '';
  // Reward box info
  document.getElementById('test-reward-ul').value = d.reward_ul;
  document.getElementById('reward-info').textContent =
    `${d.reward_ul}µl \u2192 ${d.pulse_ms}ms pulse`;
  // Hardware checkboxes
  document.getElementById('hw-stim').checked = !!d.use_stim;
  document.getElementById('hw-reward').checked = !!d.use_reward;
  document.getElementById('hw-licks').checked = !!d.use_licks;
  document.getElementById('hw-camera').checked = !!d.use_camera;
  document.getElementById('hw-camera-opts').style.display = d.use_camera ? '' : 'none';
  document.getElementById('hw-photodiode').checked = !!d.use_photodiode;
  document.getElementById('hw-pd-opts').style.display = d.use_photodiode ? '' : 'none';
  // Enable Load Hardware button
  document.getElementById('btn-load-hw').disabled = false;
  // Sync rig dropdown
  if (d.rig_name && d.rig_name !== currentRigName) {
    currentRigName = d.rig_name;
    const sel = document.getElementById('rig-select');
    for (const opt of sel.options) { if (opt.value === d.rig_name) { opt.selected = true; break; } }
    document.getElementById('rig-path-box').value = `/config/rig_${d.rig_name}.json`;
  }
  // Build Pi connection table
  piList = (d.pis || []).map(p => ({...p, connected: false}));
  allInitialized = false;
  renderConnTable();
  // Show all boxes (grayed out until Load Hardware)
  showAllBoxes();
}

// ── Hardware monitor boxes ───────────────────────────────────────────────────

const HW_MAP = [
  { id:'stim',      checkbox:'hw-stim' },
  { id:'reward',    checkbox:'hw-reward' },
  { id:'lick',      checkbox:'hw-licks' },
  { id:'camera',    checkbox:'hw-camera' },
  { id:'photodiode',checkbox:'hw-photodiode' },
];

function showAllBoxes() {
  // Show all boxes but keep them disabled until loadHardware()
  HW_MAP.forEach(h => {
    document.getElementById('box-'+h.id).style.display = '';
    document.getElementById('box-'+h.id).classList.add('hw-disabled');
  });
}

function loadHardware() {
  hwLoaded = true;
  HW_MAP.forEach(h => {
    const enabled = document.getElementById(h.checkbox).checked;
    const box = document.getElementById('box-'+h.id);
    if (enabled) {
      box.classList.remove('hw-disabled');
    } else {
      box.classList.add('hw-disabled');
    }
  });
  updateHW();
  addLog('Hardware loaded — enabled boxes are active', 'lc-ok');
}

function onLiveToggle(name) {
  const cb = document.getElementById('live-'+name);
  liveState[name] = cb.checked;
  const dot = document.getElementById('live-dot-'+name);
  dot.className = cb.checked ? 'live-dot on' : 'live-dot';

  // Start/stop monitoring based on livestream toggle
  if (name === 'lick') {
    if (cb.checked && !lickMonitorOn) {
      startLickMonitor();
    }
    document.getElementById('lick-event-list').style.display = cb.checked ? '' : 'none';
    if (cb.checked) {
      drawLickRaster();
      document.getElementById('lick-counter').textContent = `Licks: ${lickCountSession}`;
    }
  }
  if (name === 'photodiode') {
    if (cb.checked && !pdMonitorOn) {
      startPdMonitor();
    }
    document.getElementById('pd-event-list').style.display = cb.checked ? '' : 'none';
    if (cb.checked) drawPdRaster();
  }
  if (name === 'camera') {
    if (cb.checked && !camStreamOn) {
      startCameraStream();
    } else if (!cb.checked && camStreamOn) {
      stopCameraStream();
    }
  }
}

function updateLiveDots() {
  HW_MAP.forEach(h => {
    const dot = document.getElementById('live-dot-'+h.id);
    if (dot) dot.className = liveState[h.id] ? 'live-dot on' : 'live-dot';
  });
}

// ── Lick raster (in monitor box) ────────────────────────────────────────────
const lickCanvas = document.getElementById('lick-raster');
const lickCtx = lickCanvas.getContext('2d');

function drawLickRaster() {
  const wrap = lickCanvas.parentElement;
  const W = wrap.clientWidth; const H = wrap.clientHeight;
  lickCanvas.width = W; lickCanvas.height = H;
  lickCtx.fillStyle = '#0a0f18'; lickCtx.fillRect(0,0,W,H);
  if (!lickTimes.length) return;
  const now = lickTimes[lickTimes.length-1];
  // Keep 30s window
  lickTimes = lickTimes.filter(t => now-t < 30);
  lickCtx.fillStyle = '#60a5fa';
  lickTimes.forEach(t => {
    const x = W - (now-t)/30*W;
    lickCtx.fillRect(x-1, H*.1, 2, H*.8);
  });
  lickCtx.fillStyle = '#374151'; lickCtx.font = '9px monospace';
  lickCtx.fillText('30s', 4, H-3);
  lickCtx.fillText('now', W-24, H-3);
}

// ── Photodiode raster ────────────────────────────────────────────────────────
const pdCanvas = document.getElementById('pd-raster');
const pdCtx = pdCanvas.getContext('2d');

function drawPdRaster() {
  const wrap = pdCanvas.parentElement;
  const W = wrap.clientWidth; const H = wrap.clientHeight;
  pdCanvas.width = W; pdCanvas.height = H;
  pdCtx.fillStyle = '#0a0f18'; pdCtx.fillRect(0,0,W,H);
  if (!pdTimes.length) return;
  const now = pdTimes[pdTimes.length-1];
  pdTimes = pdTimes.filter(t => now-t < 30);
  pdCtx.fillStyle = '#fbbf24';
  pdTimes.forEach(t => {
    const x = W - (now-t)/30*W;
    pdCtx.fillRect(x-1, H*.1, 2, H*.8);
  });
  pdCtx.fillStyle = '#374151'; pdCtx.font = '9px monospace';
  pdCtx.fillText('30s', 4, H-3);
  pdCtx.fillText('now', W-24, H-3);
}

window.addEventListener('resize', () => {
  if (liveState.lick) drawLickRaster();
  if (liveState.photodiode) drawPdRaster();
});

// ── Actions ──────────────────────────────────────────────────────────────────
function loadCfg() {
  const p = document.getElementById('cfg-path').value;
  const rigName = currentRigName || '';
  // Pass subject/date/session_num if already filled in UI
  const subj = document.getElementById('exp-subject').value || '';
  const dt = document.getElementById('exp-date').value || '';
  const sn = document.getElementById('exp-sessnum').value || '';
  const body = {path:p, rig_name: rigName};
  if (subj) body.subject_id = subj;
  if (dt) body.date = dt;
  if (sn) body.session_num = parseInt(sn);
  fetch('/api/load_config', {method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)})
  .then(r=>r.json()).then(d => { if(d.error) addLog('Config error: '+d.error,'lc-err'); });
}

function saveCfg() {
  fetch('/api/save_config', {method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({path: document.getElementById('cfg-path').value})})
  .then(r=>r.json()).then(d => addLog(d.ok?'Config saved':'Save error: '+d.error, d.ok?'lc-ok':'lc-err'));
}

function updateExp() {
  const adOn = document.getElementById('exp-adaptive').checked;
  document.getElementById('exp-adaptive-opts').style.display = adOn ? '' : 'none';
  const parseList = s => s.split(',').map(x => parseFloat(x.trim())).filter(x => !isNaN(x));
  fetch('/api/update_experiment', {method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      subject_id:       document.getElementById('exp-subject').value,
      date:             document.getElementById('exp-date').value,
      session_num:      parseInt(document.getElementById('exp-sessnum').value) || 1,
      level:            parseInt(document.getElementById('exp-level').value),
      n_trials:         parseInt(document.getElementById('exp-ntrials').value),
      block_size:       parseInt(document.getElementById('exp-blocksize').value),
      block_sequence:   parseList(document.getElementById('exp-blockseq').value),
      size_deg:         parseFloat(document.getElementById('exp-size').value),
      duration_s:       parseFloat(document.getElementById('exp-dur').value),
      altitude_deg:     parseFloat(document.getElementById('exp-alt').value),
      background_gray:  parseFloat(document.getElementById('exp-bg').value),
      max_lick_rate:    parseFloat(document.getElementById('exp-maxlick').value),
      contrast_values:  parseList(document.getElementById('exp-contrast').value),
      contrast_probs:   parseList(document.getElementById('exp-cprobs').value),
      iti_min:          parseFloat(document.getElementById('exp-itimin').value),
      iti_max:          parseFloat(document.getElementById('exp-itimax').value),
      response_window_s: parseFloat(document.getElementById('exp-respwin').value),
      reward_delay_s:   parseFloat(document.getElementById('exp-rewdelay').value),
      adaptive_enabled: adOn,
      adaptive_step_up: parseFloat(document.getElementById('exp-stepup').value),
      adaptive_step_down: parseFloat(document.getElementById('exp-stepdn').value),
      notes:            document.getElementById('exp-notes').value,
    })});
}

function updateHW() {
  const licks = document.getElementById('hw-licks').checked;
  const cam = document.getElementById('hw-camera').checked;
  const pd  = document.getElementById('hw-photodiode').checked;
  document.getElementById('hw-camera-opts').style.display = cam ? '' : 'none';
  document.getElementById('hw-pd-opts').style.display     = pd  ? '' : 'none';
  // If a monitor is on but its hardware was unchecked, stop it
  if (!licks && lickMonitorOn) stopLickMonitor();
  if (!pd && pdMonitorOn) stopPdMonitor();
  if (!cam && camStreamOn) stopCameraStream();
  fetch('/api/update_hw', {method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      use_stim: document.getElementById('hw-stim').checked,
      use_reward: document.getElementById('hw-reward').checked,
      use_licks: licks,
      use_camera: cam,
      camera_res: document.getElementById('hw-cam-res').value,
      camera_fps: parseInt(document.getElementById('hw-cam-fps').value),
      use_photodiode: pd,
      pd_gpio: parseInt(document.getElementById('hw-pd-gpio').value),
      pd_n:    parseInt(document.getElementById('hw-pd-n').value),
    })});
}

function onHwLickChange() {
  const cb = document.getElementById('hw-licks');
  if (cb.checked && controlConnected) {
    pendingLickCheck = true;
    addLog('Checking lick sensor...','lc-info');
    fetch('/api/check_lick_sensor', {method:'POST'});
  }
  updateHW();
}

function onHwCameraChange() {
  const cb = document.getElementById('hw-camera');
  if (cb.checked && controlConnected) {
    pendingCameraCheck = true;
    addLog('Checking camera...','lc-info');
    fetch('/api/check_camera_device', {method:'POST'});
  }
  updateHW();
}

// ── Connections table ────────────────────────────────────────────────────────

function renderConnTable() {
  const box = document.getElementById('conn-table');
  box.innerHTML = '';
  piList.forEach((pi, i) => {
    const stCls = pi.connected ? 'st-connected' : 'st-setup';
    const stTxt = pi.connected ? 'Connected' : 'Disconnected';
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #1f2937;font-size:12px';
    row.innerHTML = `
      <span style="flex:1;color:#e0e0e0">${pi.name} <span style="color:#6b7280">(${pi.role})</span></span>
      <span style="color:#6b7280;font-size:11px">${pi.ip}</span>
      <span class="badge ${stCls}" style="min-width:85px;text-align:center">${stTxt}</span>
      <button class="btn btn-blue" style="padding:4px 10px;font-size:11px"
              onclick="initializePi(${i})" id="btn-init-${i}"
              ${pi.connected ? 'disabled' : ''}>Initialize</button>`;
    box.appendChild(row);
  });
  renderInitAllBtn();
}

function renderInitAllBtn() {
  const btn = document.getElementById('btn-init-all');
  btn.disabled = false;
  if (allInitialized) {
    btn.className = 'btn btn-green btn-block';
    btn.textContent = 'Refresh Connections';
    btn.onclick = refreshConnections;
  } else {
    btn.className = 'btn btn-blue btn-block';
    btn.textContent = 'Initialize All';
    btn.onclick = initializeAll;
  }
}

function initializePi(i) {
  const pi = piList[i];
  if (pi.connected) return;
  const btn = document.getElementById(`btn-init-${i}`);
  btn.disabled = true; btn.textContent = 'Initializing...';
  btn.className = 'btn btn-gray';
  document.getElementById('btn-init-all').disabled = true;
  addLog(`Initializing ${pi.name} (${pi.role})...`, 'lc-info');
  fetch('/api/connect', {method:'POST',
    headers:{'Content-Type':'application/json'}, body:JSON.stringify({role: pi.role})})
  .then(r=>r.json()).then(d => {
    if (d.error) {
      addLog(`${pi.name} error: ${d.error}`, 'lc-err');
      btn.disabled = false; btn.textContent = 'Initialize';
      btn.className = 'btn btn-blue';
      document.getElementById('btn-init-all').disabled = false;
    }
  });
  setTimeout(() => {
    if (!pi.connected && btn.disabled) {
      btn.disabled = false; btn.textContent = 'Initialize';
      btn.className = 'btn btn-blue';
      document.getElementById('btn-init-all').disabled = false;
    }
  }, 30000);
}

function initializeAll() {
  piList.forEach((_, i) => {
    if (!piList[i].connected) initializePi(i);
  });
}

function refreshConnections() {
  addLog('Checking connections...', 'lc-info');
  piList.forEach((pi, i) => {
    fetch('/api/test_ssh', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ip: pi.ip})})
    .then(r=>r.json()).then(d => {
      pi.connected = d.ok;
      const id = pi.role === 'stim' ? 'ind-stim' : 'ind-ctrl';
      document.getElementById(id).className = d.ok ? 'ind ind-ok' : 'ind';
      if (pi.role === 'control') {
        controlConnected = d.ok;
        document.getElementById('btn-reward').disabled = !d.ok;
      }
      renderConnTable();
      addLog(`${pi.name}: ${d.ok ? 'online' : 'offline — ' + d.info}`,
             d.ok ? 'lc-ok' : 'lc-err');
    });
  });
}

// ── Reward (in monitor box) ──────────────────────────────────────────────────

function deliverReward() {
  const ul = parseFloat(document.getElementById('test-reward-ul').value);
  fetch('/api/reward', {method:'POST',
    headers:{'Content-Type':'application/json'}, body:JSON.stringify({amount_ul:ul})})
  .then(r=>r.json()).then(d => {
    if(d.ok) addLog(`Reward ${ul}µl (${d.pulse_ms}ms) delivered`,'lc-reward');
    else addLog('Reward error: '+d.error,'lc-err');
  });
}

function updateRewardInfo() {
  const ul = parseFloat(document.getElementById('test-reward-ul').value);
  if (isNaN(ul) || ul <= 0) return;
  fetch('/api/calc_pulse', {method:'POST',
    headers:{'Content-Type':'application/json'}, body:JSON.stringify({amount_ul:ul})})
  .then(r=>r.json()).then(d => {
    if (d.ok) {
      document.getElementById('reward-info').textContent =
        `${d.amount_ul}µl \u2192 ${d.pulse_ms}ms pulse`;
    }
  });
}

// ── Camera (in monitor box) ──────────────────────────────────────────────────

function toggleCameraStream() {
  if (camStreamOn) stopCameraStream();
  else startCameraStream();
}

function startCameraStream() {
  const btn = document.getElementById('btn-check-cam');
  fetch('/api/check_camera').then(r=>r.json()).then(d => {
    if (d.url) {
      camStreamOn = true;
      document.getElementById('cam-stream').src = d.url;
      document.getElementById('cam-stream').style.display = '';
      document.getElementById('cam-off-msg').style.display = 'none';
      btn.textContent = 'Stop stream';
      btn.className = 'btn btn-red btn-block';
      addLog('Camera stream started','lc-ok');
    } else {
      addLog('Camera error: '+(d.error||'unknown'),'lc-err');
    }
  });
}

function stopCameraStream() {
  camStreamOn = false;
  const btn = document.getElementById('btn-check-cam');
  document.getElementById('cam-stream').src = '';
  document.getElementById('cam-stream').style.display = 'none';
  document.getElementById('cam-off-msg').style.display = '';
  btn.textContent = 'Check Camera';
  btn.className = 'btn btn-gray btn-block';
  addLog('Camera stream stopped','lc-info');
}

// ── Lick monitor ─────────────────────────────────────────────────────────────

function checkLickSensor() {
  if (!controlConnected) { addLog('Control Pi not connected','lc-err'); return; }
  addLog('Checking lick sensor...','lc-info');
  fetch('/api/check_lick_sensor', {method:'POST'});
}

function toggleLickMonitor() {
  if (lickMonitorOn) stopLickMonitor();
  else startLickMonitor();
}

function startLickMonitor() {
  lickMonitorOn = true;
  const btn = document.getElementById('btn-monitor-lick');
  btn.textContent = 'Stop Monitor';
  btn.className = 'btn btn-red';
  document.getElementById('lick-event-list').style.display = '';
  document.getElementById('lick-event-list').innerHTML = '';
  fetch('/api/monitor_licks', {method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({enable: true})});
  addLog('Lick monitor started — touch the spout','lc-info');
}

function stopLickMonitor() {
  lickMonitorOn = false;
  const btn = document.getElementById('btn-monitor-lick');
  btn.textContent = 'Monitor Licks';
  btn.className = 'btn btn-gray';
  fetch('/api/monitor_licks', {method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({enable: false})});
  addLog('Lick monitor stopped','lc-info');
}

// ── Photodiode monitor ───────────────────────────────────────────────────────

function togglePhotodiodeMonitor() {
  if (pdMonitorOn) stopPdMonitor();
  else startPdMonitor();
}

function startPdMonitor() {
  pdMonitorOn = true;
  const btn = document.getElementById('btn-monitor-pd');
  btn.textContent = 'Stop Monitor';
  btn.className = 'btn btn-red';
  document.getElementById('pd-event-list').style.display = '';
  document.getElementById('pd-event-list').innerHTML = '';
  fetch('/api/monitor_photodiode', {method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({enable: true})});
  addLog('Photodiode monitor started','lc-info');
}

function stopPdMonitor() {
  pdMonitorOn = false;
  const btn = document.getElementById('btn-monitor-pd');
  btn.textContent = 'Monitor Photodiode';
  btn.className = 'btn btn-gray';
  fetch('/api/monitor_photodiode', {method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({enable: false})});
  addLog('Photodiode monitor stopped','lc-info');
}

// ── Stimulus ─────────────────────────────────────────────────────────────────

function generateStims() {
  addLog('Generating stimuli on stim Pi...','lc-info');
  const btn = document.getElementById('btn-gen-stims');
  btn.disabled = true; btn.textContent = 'Generating...';
  fetch('/api/generate_stim_thumbnails', {method:'POST'})
  .then(r=>r.json()).then(d => {
    btn.disabled = false; btn.textContent = 'Generate Stims';
    if (d.ok) {
      addLog(`Stims generated: ${d.count} trials`, 'lc-ok');
      // Populate dropdown
      const sel = document.getElementById('stim-select');
      sel.innerHTML = '<option value="">— select trial —</option>';
      for (let i = 0; i < d.count; i++) {
        const opt = document.createElement('option');
        opt.value = i; opt.textContent = `Trial ${i+1}`;
        sel.appendChild(opt);
      }
    } else {
      addLog('Stim generation error: '+(d.error||'unknown'), 'lc-err');
    }
  });
}

function previewStim() {
  const sel = document.getElementById('stim-select');
  const idx = sel.value;
  if (idx === '') return;
  const img = document.querySelector('#stim-preview-area img');
  const ph = document.querySelector('#stim-preview-area .cam-placeholder');
  if (img) {
    img.src = `/api/stim_thumbnail?trial=${idx}&t=${Date.now()}`;
    img.style.display = '';
    if (ph) ph.style.display = 'none';
  }
}

// ── Session control ──────────────────────────────────────────────────────────

function goExperiment() {
  if (!confirm('Start experiment?')) return;
  trialCount = 0; hitCount = 0;
  rewardDelivered = 0; rewardMissed = 0;
  lickCountSession = 0;
  document.getElementById('reward-trial-log').innerHTML = '';
  document.getElementById('reward-summary').textContent = '';
  document.getElementById('lick-counter').textContent = 'Licks: 0';
  fetch('/api/start',{method:'POST'}).then(r=>r.json()).then(d => {
    if(d.error) addLog('Start error: '+d.error,'lc-err');
    else addLog('Experiment started','lc-stim');
  });
}

function endSession() {
  if (!confirm('End session?')) return;
  fetch('/api/end',{method:'POST'}).then(r=>r.json()).then(d => {
    addLog('Session ended — ready for next run','lc-warn');
    trialCount = 0; hitCount = 0; lickTimes = []; pdTimes = [];
    document.getElementById('st-trials').textContent = '0';
    document.getElementById('st-hr').textContent = '—';
    document.getElementById('st-block').textContent = '—';
    document.getElementById('st-adapt').textContent = '—';
    if (liveState.lick) drawLickRaster();
    if (liveState.photodiode) drawPdRaster();
  });
}

function transferData() {
  if (!confirm('End session and transfer all data to Mac?')) return;
  addLog('Transferring data...','lc-info');
  fetch('/api/transfer',{method:'POST'}).then(r=>r.json()).then(d => {
    if(d.ok) addLog(`Transfer complete: ${d.files} files transferred`,'lc-ok');
    else addLog('Transfer error: '+d.error,'lc-err');
  });
}

// ── Utilities ────────────────────────────────────────────────────────────────

function addEventEntry(listId, cls, text) {
  const list = document.getElementById(listId);
  if (!list) return;
  const div = document.createElement('div');
  div.className = cls;
  div.textContent = text;
  list.prepend(div);
  if (list.children.length > 100) list.removeChild(list.lastChild);
}

function addLog(msg, cls='lc-info') {
  const box = document.getElementById('log-box');
  const t   = new Date().toLocaleTimeString();
  const div = document.createElement('div');
  div.className = cls;
  div.textContent = `[${t}] ${msg}`;
  box.prepend(div);
  if (box.children.length > 150) box.removeChild(box.lastChild);
}

document.getElementById('exp-date').value =

  String(_now.getMonth()+1).padStart(2,'0') +
  String(_now.getDate()).padStart(2,'0');
document.getElementById('exp-sessnum').value = 1;
refreshRigList(null);
</script>
