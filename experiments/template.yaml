last_saved: ''
# Barebones session: a simple 4-phase trial loop, no response contingency.
# One trial = ITI -> pre-stim -> stim (timed placeholder window) -> post-stim.
session:
  grace_period_s: 10    # wait after GO before trial 0
  n_trials: 60
  iti_s: 5              # scalar, or [min, max] for a uniform draw per trial
  prestim_s: 2
  stim_s: 2
  poststim_s: 2
# Per-device tunables, consumed generically by the engine (Device.task_params_schema
# contract): the map key is the rig device name, the value is passed to its init() as
# task_params, e.g.:
#   worldcam: {fps: 30}
devices: {}
