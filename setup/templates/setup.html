<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VRFarm Rig Setup</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: #1a1a2e; color: #e0e0e0; padding: 16px; font-size: 13px; }
  h1 { font-size: 18px; margin-bottom: 12px; color: #fff; }
  h3 { font-size: 13px; margin-bottom: 6px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }

  .grid { display: grid; grid-template-columns: 350px 1fr; gap: 16px; }

  .card { background: #16213e; border-radius: 8px; padding: 14px; margin-bottom: 12px; }
  label { display: block; font-size: 11px; color: #888; margin-bottom: 2px; margin-top: 6px; }
  select, input[type=text], input[type=number] {
    width: 100%; padding: 5px 8px; border: 1px solid #333; border-radius: 4px;
    background: #0f3460; color: #e0e0e0; font-size: 13px; }

  .btn { padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer;
         font-size: 12px; font-weight: 600; }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .btn-blue { background: #1a73e8; color: #fff; }
  .btn-green { background: #2e7d32; color: #fff; }
  .btn-red { background: #c62828; color: #fff; }
  .btn-orange { background: #e65100; color: #fff; }
  .btn-yellow { background: #f9a825; color: #000; }
  .btn-gray { background: #555; color: #fff; }
  .btn:hover:not(:disabled) { opacity: 0.85; }
  .btn-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .btn-sm { padding: 3px 10px; font-size: 11px; }

  .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
  .dot-green { background: #4caf50; }
  .dot-red { background: #f44336; }
  .dot-gray { background: #666; }
  .dot-yellow { background: #f9a825; }

  .pi-card { background: #0f3460; border-radius: 6px; padding: 12px; margin-bottom: 10px; }
  .pi-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .pi-header strong { font-size: 14px; color: #fff; }
  .pi-header .role-badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 700; }
  .pi-header .role-badge.leader { background: #000; color: #fff; }

  .device-chip { display: inline-block; padding: 2px 8px; border-radius: 10px;
                 font-size: 11px; margin: 2px; background: #333; color: #ccc; }
  .device-chip.enabled { background: #2e7d32; color: #fff; }

  .device-card { background: #0f3460; border-radius: 6px; padding: 10px; margin-bottom: 8px; }
  .device-card h4 { font-size: 12px; color: #ccc; margin-bottom: 4px; }

  /* Device cards shown as Chrome-style tabs */
  .device-tabs { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 3px;
                 padding-left: 2px; border-bottom: 2px solid #0f3460; }
  .device-tab { display: inline-flex; align-items: center; gap: 4px; cursor: pointer;
                background: #16213e; border: 1px solid #0f3460; border-bottom: none;
                border-radius: 8px 8px 0 0; padding: 6px 12px; margin-bottom: -2px;
                font-size: 12px; font-weight: 600; max-width: 180px; }
  .device-tab:hover { background: #1c2a52; }
  .device-tab.active { background: #0f3460; }
  .device-tab-label { color: #bcd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .device-tab.active .device-tab-label { color: #fff; }
  .device-panels { background: #0f3460; border-radius: 0 0 6px 6px; padding: 6px 8px 8px; }
  .device-panels .device-card { background: transparent; padding: 4px; margin-bottom: 0;
                                border-radius: 0; }
  .device-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  /* Wraps a device's params + action buttons; disabled until Initialize is first pressed */
  .device-fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
  .device-fieldset:disabled { opacity: 0.55; }
  .device-field { display: inline-flex; align-items: center; gap: 4px; }
  .device-field label { margin: 0; font-size: 10px; white-space: nowrap; }
  .device-field input, .device-field select { width: auto; min-width: 60px; max-width: 140px;
    padding: 3px 6px; font-size: 12px; }

  .mon-box { background: #0a0a1a; border-radius: 4px; margin-top: 6px; padding: 6px 8px;
             font-family: monospace; font-size: 11px; color: #9ac; max-height: 120px;
             overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
  .stream-container { margin-top: 6px; }
  .stream-container img { max-width: 360px; border-radius: 4px; display: block; }
  /* Placeholder shown in the live-stream window before Live is pressed. */
  .stream-offline { width: 320px; height: 180px; border-radius: 4px; background: #2a2a2a;
                    display: flex; align-items: center; justify-content: center;
                    color: #777; font-size: 15px; font-weight: 700; letter-spacing: 2px; }

  #log { background: #0a0a1a; border-radius: 4px; padding: 8px; font-family: monospace;
         font-size: 11px; max-height: 200px; overflow-y: auto; color: #888; }

  .quit-btn { position: fixed; top: 12px; right: 12px; width: 32px; height: 32px;
              border-radius: 50%; border: none; background: #c62828; color: #fff;
              font-size: 14px; font-weight: 700; cursor: pointer; opacity: 0.5;
              transition: opacity 0.2s; z-index: 999; line-height: 32px; text-align: center; }
  .quit-btn:hover:not(:disabled) { opacity: 1; }
  .quit-btn:disabled { opacity: 0.2; cursor: not-allowed; }

  /* Toggle switch (ON=green / OFF=gray) — a styled checkbox, so .checked still works. */
  .toggle { position: relative; display: inline-block; width: 44px; height: 18px;
            flex: none; vertical-align: middle; }
  .toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
  .toggle .track { position: absolute; inset: 0; cursor: pointer; border-radius: 9px;
                   background: #b8b8b8; transition: background 0.15s; }
  .toggle .track::before {          /* the sliding knob */
    content: ""; position: absolute; width: 14px; height: 14px; left: 2px; top: 2px;
    border-radius: 50%; background: #fff; transition: transform 0.15s;
    box-shadow: 0 1px 2px rgba(0,0,0,0.4); }
  .toggle .track::after {           /* the ON/OFF label, on the side opposite the knob, v-centered */
    content: "OFF"; position: absolute; right: 5px; top: 0; bottom: 0;
    display: flex; align-items: center;
    font-size: 11px; font-weight: 700; color: #fff; letter-spacing: 0.3px; }
  .toggle input:checked + .track { background: #7ac142; }
  .toggle input:checked + .track::before { transform: translateX(26px); }
  .toggle input:checked + .track::after { content: "ON"; left: 6px; right: auto; }
  .toggle input:disabled + .track { opacity: 0.45; cursor: not-allowed; }
</style>
</head>
<body>

<button class="quit-btn" id="btn-quit" onclick="quitApp()" title="Quit server">&times;</button>
<h1>VRFarm Rig Setup</h1>

<div class="grid">
  <!-- Sidebar -->
  <div>
    <div class="card">
      <h3>Rig</h3>
      <label>Load existing</label>
      <select id="rig-select">
        <option value="">-- select --</option>
        {% for r in rigs %}<option value="{{ r }}">{{ r }}</option>{% endfor %}
      </select>
      <div class="btn-row">
        <button class="btn btn-blue" onclick="loadRig()">Load Rig</button>
        <button class="btn btn-green" onclick="createRig()">New Rig</button>
        <button class="btn btn-blue" onclick="saveRig()">Save Rig</button>
      </div>
      <div style="margin-top:8px; border-top:1px solid #333; padding-top:6px">
        <div style="display:flex; align-items:center; gap:6px">
          <span style="display:inline-block; flex:none; width:56px; font-size:12px; white-space:nowrap">Slack</span>
          <label class="toggle">
            <input type="checkbox" id="slack-enabled" onchange="onSlackChange()">
            <span class="track"></span>
          </label>
          <input type="text" id="slack-webhook" placeholder="https://hooks.slack.com/services/..."
                 style="flex:1; min-width:0; font-size:11px" oninput="onSlackChange()">
        </div>
        <div style="font-size:10px; color:#666; margin-top:2px">Saved in the rig config. Activates on Load Rig from experiment UI.</div>
        <!-- Process monitoring (shepherd). Toggling starts/stops the shepherd service on the
             leader live (via /api/shepherd); the setting is also saved and re-applied on Install. -->
        <div style="display:flex; align-items:center; gap:6px; margin-top:8px">
          <span style="display:inline-block; flex:none; width:56px; font-size:12px; white-space:nowrap">Monitor</span>
          <label class="toggle">
            <input type="checkbox" id="shepherd-enabled" onchange="onShepherdChange()">
            <span class="track"></span>
          </label>
        </div>
        <div style="font-size:10px; color:#666; margin-top:2px">Run resource monitor on the leader (applies now).</div>
        <div style="display:flex; align-items:center; gap:6px; margin-top:8px">
          <label style="font-size:12px; margin:0; white-space:nowrap; width:60px">Data Dir</label>
          <input type="text" id="data-leader-dir" placeholder="/home/pi/data"
                 style="flex:1; min-width:0; font-size:11px" oninput="onDataDirChange()">
        </div>
        <div style="display:flex; align-items:center; gap:6px; margin-top:4px">
          <label style="font-size:12px; margin:0; white-space:nowrap; width:60px">Video Dir</label>
          <input type="text" id="data-video-dir" placeholder="/home/pi/video"
                 style="flex:1; min-width:0; font-size:11px" oninput="onDataDirChange()">
        </div>
        <div style="font-size:10px; color:#666; margin-top:2px">Leader-Pi paths, saved in the rig.</div>
      </div>
    </div>

    <div class="card">
      <h3>Pi Management</h3>

      <div style="font-size:12px; color:#ccc; font-weight:700; margin-bottom:4px">Add a Pi</div>
      <label>Name</label>
      <input type="text" id="add-pi-name" placeholder="e.g. rpi-demo0">
      <label>IP</label>
      <input type="text" id="add-pi-ip" placeholder="192.168.10.103">
      <label>User</label>
      <input type="text" id="add-pi-user" value="pi">
      <label>Role</label>
      <select id="add-pi-role">
        <option value="leader">Leader</option>
      </select>
      <div class="btn-row">
        <button class="btn btn-green" onclick="addPi()">Add Pi</button>
      </div>

      <div style="border-top:1px solid #333; margin:12px 0 8px"></div>
      <div style="font-size:12px; color:#ccc; font-weight:700; margin-bottom:4px">Update / remove an existing Pi</div>
      <label>Target Pi (name or IP)</label>
      <input type="text" id="manage-pi-id" placeholder="rpi-demo0 or 192.168.10.103" oninput="syncUpdatePiValue()">
      <label>Field to update</label>
      <select id="update-pi-field" onchange="syncUpdatePiValue()">
        <option value="name">Name</option>
        <option value="ip">IP</option>
        <option value="user">User</option>
        <option value="role">Role</option>
      </select>
      <input type="text" id="update-pi-value" placeholder="e.g. rpi-demo0">
      <div class="btn-row">
        <button class="btn btn-blue" onclick="updatePi()">Update Pi</button>
        <button class="btn btn-red" onclick="removePi()">Remove Pi</button>
      </div>
    </div>

    <div class="card">
      <h3>Device Catalog</h3>
      <div id="device-catalog">Loading...</div>
    </div>
  </div>

  <!-- Main area -->
  <div>
    <!-- Pi status + Log side by side: during hardware setup, watch device/init logs right
         next to the Pi cards. -->
    <div style="display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap;">
      <div class="card" style="flex:1; min-width:280px; margin-bottom:0;">
        <h3>Pis</h3>
        <div id="pi-list"></div>
      </div>
      <div class="card" style="flex:1; min-width:260px; min-height:180px; margin-bottom:0; display:flex; flex-direction:column; overflow:hidden;">
        <h3>Log</h3>
        <!-- min-height:0 lets the log scroll inside the card instead of growing it (which would
             drag the Pis card taller via align-items:stretch). Card height then tracks the Pis card. -->
        <div id="log" style="flex:1; min-height:0; max-height:none;"></div>
      </div>
    </div>

    <div class="card" style="margin-top:12px;">
      <h3 style="display:flex; align-items:center; gap:8px">
        Devices
        <button id="init-btn" class="btn btn-green btn-sm" onclick="initDevices()" disabled>Initialize</button>
      </h3>
      <div id="device-list"></div>
    </div>
  </div>
</div>

<script>
let rig = null;
let deviceSchemas = {};
let catalogSel = '';        // remembered Device Catalog dropdown selection
let deviceState = {};
let piState = {};       // ip -> {checked: bool}
let devicesInitialized = false;
let monPolls = {};      // device name -> monitor poll interval
let uiBusy = false;

fetch('/api/device_schemas').then(r => r.json()).then(schemas => {
  deviceSchemas = schemas;
  renderDeviceCatalog();
});

// ── Helpers ──

function getPiForDevice(devName) {
  if (!rig) return null;
  for (const pi of rig.pis) {
    if ((pi.devices || []).includes(devName)) return pi;
  }
  return null;
}

async function proxyPi(ip, endpoint, payload = {}, method = 'POST') {
  try {
    const r = await fetch('/api/proxy', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ip, port: rig.network.api_port, endpoint, method, payload})
    });
    return await r.json();
  } catch (e) {
    log('Proxy error: ' + e);
    return {ok: false, error: String(e)};
  }
}

// ── Rig management ──

function allPisOk() {
  if (!rig || !rig.pis.length) return false;
  return rig.pis.every(pi => {
    const ps = piState[pi.ip];
    return ps && ps.checked && ps.ok;
  });
}

// Freeze everything a lock should hold: all buttons, the (non-.btn) Quit button, and the raw
// device-fieldset inputs/selects that _lockUI's .btn sweep would otherwise miss. Re-applied
// after any re-render during a lock so a mid-operation renderAll() can't silently re-arm the UI.
function _applyLockState() {
  document.querySelectorAll('.btn').forEach(b => b.disabled = true);
  const q = document.getElementById('btn-quit'); if (q) q.disabled = true;
  document.querySelectorAll('.device-fieldset').forEach(f => f.disabled = true);
}
function _lockUI() {
  uiBusy = true;
  _applyLockState();
}
function _unlockUI() {
  uiBusy = false;
  document.querySelectorAll('.btn').forEach(b => b.disabled = false);
  const q = document.getElementById('btn-quit'); if (q) q.disabled = false;
  // Re-apply contextual disabling
  if (!allPisOk()) document.getElementById('init-btn').disabled = true;
  renderPiList();   // re-apply the offline-Pi button lockdown the blanket enable above cleared
  renderDeviceList();
}

async function checkAllPis() {
  if (!rig) return;
  log('Checking all Pis...');
  const promises = rig.pis.map(async (pi) => {
    try {
      // `user` matters: the SSH probe runs as this user, and Install stays disabled
      // until SSH succeeds — a rig with a non-default user must probe as that user.
      const r = await fetch('/api/check_pi', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ip: pi.ip, user: pi.user || 'vruser', api_port: rig.network.api_port})
      });
      const data = await r.json();
      piState[pi.ip] = {checked: true, ok: data.api, ssh: data.ssh, api: data.api};
      log(`  ${pi.name}: SSH ${data.ssh ? 'OK' : 'FAIL'}, API ${data.api ? 'OK' : 'FAIL'}`);
    } catch (e) {
      piState[pi.ip] = {checked: true, ok: false};
      log(`  ${pi.name}: FAIL (${e})`);
    }
  });
  await Promise.all(promises);
  renderAll();
  if (allPisOk()) {
    document.getElementById('init-btn').disabled = false;
    log('All Pis online.');
  } else {
    document.getElementById('init-btn').disabled = true;
    log('Some Pis offline — devices disabled.');
  }
}

async function loadRig() {
  const name = document.getElementById('rig-select').value;
  if (!name) return;
  _lockUI();
  log('Loading rig ' + name + '...');
  try {
    const r = await fetch('/api/load_rig', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name})
    });
    rig = await r.json();
    deviceState = {};
    piState = {};
    devicesInitialized = false;
    _stopAllMonitors();
    renderAll();
    log('Loaded rig: ' + rig.name);
    await checkAllPis();
  } finally {
    _unlockUI();
  }
}

async function createRig() {
  const name = prompt('New rig name:');
  if (!name) return;
  const r = await fetch('/api/create_rig', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name})
  });
  rig = await r.json();
  deviceState = {};
  piState = {};
  devicesInitialized = false;
  document.getElementById('init-btn').disabled = true;
  renderAll();
  log('Created rig: ' + name);
  checkAllPis();
}

async function saveRig() {
  if (!rig) return;
  await fetch('/api/save_rig', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(rig)
  });
  log('Saved rig: ' + rig.name);
}

// ── Pi management ──

function addPi() {
  if (!rig) { log('Load or create a rig first'); return; }
  const pi = {
    name: document.getElementById('add-pi-name').value,
    ip: document.getElementById('add-pi-ip').value,
    user: document.getElementById('add-pi-user').value,
    role: document.getElementById('add-pi-role').value,
    devices: [],
  };
  if (!pi.name || !pi.ip) { log('Name and IP required'); return; }
  rig.pis.push(pi);
  renderAll();
  log('Added Pi: ' + pi.name);
}

// Find a Pi by exact name or IP (case-insensitive name match). Returns its index or -1.
function _findPiIndex(identifier) {
  if (!rig || !rig.pis) return -1;
  const q = (identifier || '').trim().toLowerCase();
  if (!q) return -1;
  return rig.pis.findIndex(p =>
    (p.name || '').toLowerCase() === q || (p.ip || '').toLowerCase() === q);
}

// Live-fill the Update value box with the target Pi's CURRENT value for the selected field,
// so the user edits from what's there. Fires on Target-input and Field-dropdown changes.
function syncUpdatePiValue() {
  const valEl = document.getElementById('update-pi-value');
  const field = document.getElementById('update-pi-field').value;
  const idx = _findPiIndex(document.getElementById('manage-pi-id').value);
  valEl.value = idx >= 0 ? (rig.pis[idx][field] ?? '') : '';
  valEl.placeholder = field === 'role' ? 'leader'
    : field === 'ip' ? 'e.g. 192.168.10.103'
    : field === 'user' ? 'e.g. pi' : 'e.g. rpi-demo0';
}

function removePi() {
  if (!rig) { log('Load or create a rig first'); return; }
  const id = document.getElementById('manage-pi-id').value;
  const idx = _findPiIndex(id);
  if (idx < 0) { log('No Pi matches "' + (id || '').trim() + '"'); return; }
  const pi = rig.pis[idx];
  if (!confirm(`Remove Pi "${pi.name}" (${pi.ip})?\nThis unconfigures it from the rig. Save Rig to persist.`)) return;
  delete piState[pi.ip];
  rig.pis.splice(idx, 1);
  document.getElementById('manage-pi-id').value = '';
  renderAll();
  log('Removed Pi: ' + pi.name + ' — Save Rig to persist.');
}

function updatePi() {
  if (!rig) { log('Load or create a rig first'); return; }
  const id = document.getElementById('manage-pi-id').value;
  const idx = _findPiIndex(id);
  if (idx < 0) { log('No Pi matches "' + (id || '').trim() + '"'); return; }
  const pi = rig.pis[idx];
  const field = document.getElementById('update-pi-field').value;
  let val = document.getElementById('update-pi-value').value.trim();
  if (!val) { log('Enter a new value for ' + field); return; }
  if (field === 'role') {
    val = val.toLowerCase();
    if (val !== 'leader') { log('Role must be leader'); return; }
  }
  if ((field === 'name' || field === 'ip')) {
    // guard against colliding with another Pi
    const clashIdx = _findPiIndex(val);
    if (clashIdx >= 0 && clashIdx !== idx) { log('Another Pi already uses "' + val + '"'); return; }
  }
  const old = pi[field];
  if (field === 'ip' && val !== pi.ip && piState[pi.ip]) {   // piState is keyed by ip — migrate the entry
    piState[val] = piState[pi.ip];
    delete piState[pi.ip];
  }
  pi[field] = val;
  document.getElementById('update-pi-value').value = '';
  renderAll();
  log(`Updated ${pi.name} ${field}: ${old} → ${val} — Save Rig to persist.`);
}

async function checkPi(ip) {
  log('Checking ' + ip + '...');
  const pi = rig.pis.find(p => p.ip === ip) || {};
  const r = await fetch('/api/check_pi', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ip, user: pi.user || 'vruser', api_port: rig.network.api_port})
  });
  const data = await r.json();
  const ok = data.api;
  piState[ip] = {checked: true, ok: ok, ssh: data.ssh, api: data.api};
  renderAll();
  document.getElementById('init-btn').disabled = !allPisOk();
  log(`  SSH: ${data.ssh ? 'OK' : 'FAIL'}, API: ${data.api ? 'OK' : 'FAIL'}`);
}

async function installPi(idx) {
  const pi = rig.pis[idx];
  if (!confirm('Reinstall the software environment on ' + pi.name + '?\nThis overwrites the deployed environment on that Pi.')) return;
  _lockUI();
  log('Installing ' + pi.name + '...');
  try {
    const r = await fetch('/api/install_pi', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      // shepherd_enabled rides along so Install brings the leader monitor up or takes it down.
      body: JSON.stringify({...pi, shepherd_enabled: (rig.shepherd?.enabled ?? true)})
    });
    const data = await r.json();
    (data.steps || []).forEach(s => log('  ' + s));
    log(data.ok ? 'Install complete.' : 'Install failed: ' + data.error);
  } finally {
    _unlockUI();
  }
}

async function rebootPi(idx) {
  const pi = rig.pis[idx];
  if (!confirm('Reboot ' + pi.name + '?')) return;
  _lockUI();
  log('Rebooting ' + pi.name + '...');
  try {
    const r = await fetch('/api/reboot_pi', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ip: pi.ip, user: pi.user || 'vruser'})
    });
    const data = await r.json();
    log(data.ok ? pi.name + ' is rebooting.' : 'Reboot failed: ' + data.error);
  } finally {
    _unlockUI();
  }
}

async function shutdownPi(idx) {
  const pi = rig.pis[idx];
  if (!confirm('Shutdown ' + pi.name + '? You will need physical access to turn it back on.')) return;
  _lockUI();
  log('Shutting down ' + pi.name + '...');
  try {
    const r = await fetch('/api/shutdown_pi', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ip: pi.ip, user: pi.user || 'vruser'})
    });
    const data = await r.json();
    log(data.ok ? pi.name + ' is shutting down.' : 'Shutdown failed: ' + data.error);
  } finally {
    _unlockUI();
  }
}

async function deployPi(idx) {
  const pi = rig.pis[idx];
  _lockUI();
  log('Deploying to ' + pi.name + '...');
  try {
    const r = await fetch('/api/deploy_pi', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ip: pi.ip, role: pi.role, api_port: rig.network.api_port})
    });
    const data = await r.json();
    (data.steps || []).forEach(s => log('  ' + s));
    if (data.ok) {
      log('Deploy complete.');
      // Deploy restarts pi_api, which drops the initialized devices — revert the whole device
      // panel to its pristine offline state (must re-Initialize).
      _revertDevicesToUninitialized();
      log('  pi_api restarted — devices dropped; click Initialize to re-init.');
    } else {
      log('Deploy failed: ' + data.error);
    }
  } finally {
    _unlockUI();
  }
}

// A pi_api restart (Restart API or Deploy) drops every initialized device, so revert the whole
// device panel to its ORIGINAL offline look — gray status dots, locked controls — and flip the
// Initialize button back from "Reinitialize" to "Initialize".
function _revertDevicesToUninitialized() {
  devicesInitialized = false;
  _stopAllMonitors();
  deviceState = {};   // all dots back to gray (pristine, not red/"failed"); clears streaming too
  const ib = document.getElementById('init-btn');
  if (ib) { ib.textContent = 'Initialize'; ib.className = 'btn btn-green btn-sm'; }
}

// Restart pi_api on one Pi (reloads deployed code without a full reboot). Drops that Pi's
// initialized devices.
async function restartPiApi(idx) {
  const pi = rig.pis[idx];
  if (!confirm(`Restart pi_api on ${pi.name}?\nReloads deployed code and drops its initialized devices.`)) return;
  _lockUI();
  log(`Restarting pi_api on ${pi.name}...`);
  try {
    const r = await fetch('/api/restart_pi', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ip: pi.ip, api_port: rig.network.api_port})
    });
    const data = await r.json();
    (data.steps || []).forEach(s => log('  ' + s));
    // The restart drops the Pi's initialized devices — revert the whole device panel to its
    // pristine offline state (gray dots, locked controls, button back to "Initialize").
    _revertDevicesToUninitialized();
    log(data.ok ? `pi_api back online on ${pi.name} — re-initialize devices.`
                : `pi_api on ${pi.name} may still be starting — re-check.`);
  } catch (e) { log('Restart error: ' + e); }
  finally { _unlockUI(); }
}

// ── Device management ──

function toggleDevice(devName) {
  if (!rig || uiBusy) return;   // don't mutate device config mid-operation
  const dev = rig.devices[devName];
  if (dev) {
    dev.enabled = !dev.enabled;
  } else {
    rig.devices[devName] = { type: devName, enabled: true };
  }
  renderAll();
}

function assignDeviceToPi(devName, piIdx) {
  if (!rig || uiBusy) return;   // don't re-assign devices mid-operation
  const pi = rig.pis[piIdx];
  if (pi.devices.includes(devName)) {
    pi.devices = pi.devices.filter(d => d !== devName);
  } else {
    pi.devices.push(devName);
  }
  renderAll();
}

async function initDevices() {
  _lockUI();
  const btn = document.getElementById('init-btn');
  btn.textContent = 'Initializing...';
  log('Initializing devices...');
  try {
    const r = await fetch('/api/init_devices', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({})
    });
    const data = await r.json();
    (data.steps || []).forEach(s => log('  ' + s));

    // Update device states from structured results
    const results = data.results || {};
    for (const [name, res] of Object.entries(results)) {
      deviceState[name] = deviceState[name] || {};
      deviceState[name].initialized = res.ok;
    }

    devicesInitialized = true;
    btn.textContent = 'Reinitialize';
    btn.className = 'btn btn-yellow btn-sm';
    log(data.ok ? 'All devices initialized.' : 'Some devices failed.');
  } finally {
    _unlockUI();
  }
}

// Reinitialize just one device from its card, without re-initing the whole rig.
async function reinitDevice(name) {
  _lockUI();
  log('Reinitializing ' + name + '...');
  try {
    _stopMonitorState(name);
    const r = await fetch('/api/reinit_device', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({device: name})
    });
    const data = await r.json();
    (data.steps || []).forEach(s => log('  ' + s));
    deviceState[name] = deviceState[name] || {};
    deviceState[name].initialized = !!data.ok;
    deviceState[name].streaming = false;   // a reinit closes any live stream server-side
    renderDeviceList();
    log(data.ok ? (name + ' reinitialized.') : (name + ' reinit failed: ' + (data.error || '')));
  } catch (e) { log('Reinit error: ' + e); }
  finally { _unlockUI(); }
}

// ── Generic device monitor (any device: /api/monitor_device + /api/device_data) ──

function _stopMonitorState(name) {
  if (monPolls[name]) { clearInterval(monPolls[name]); delete monPolls[name]; }
  if (deviceState[name]) deviceState[name].monitoring = false;
}

function _stopAllMonitors() {
  Object.keys(monPolls).forEach(_stopMonitorState);
}

async function startDeviceMonitor(name) {
  const pi = getPiForDevice(name);
  if (!pi) { log(name + ' not assigned to a Pi'); return; }
  const result = await proxyPi(pi.ip, '/api/monitor_device', {name});
  if (!result.ok) { log('Monitor failed: ' + (result.error || '')); return; }
  const ds = deviceState[name] = deviceState[name] || {};
  ds.monitoring = true;
  ds.monCount = 0;
  ds.monLast = null;
  renderDeviceList();
  if (monPolls[name]) clearInterval(monPolls[name]);   // never leak a prior interval
  monPolls[name] = setInterval(() => pollDeviceData(name, pi.ip), 300);
  log(name + ' monitoring started.');
}

async function stopDeviceMonitor(name) {
  const pi = getPiForDevice(name);
  if (pi) await proxyPi(pi.ip, '/api/stop_monitor_device', {name});
  _stopMonitorState(name);
  renderDeviceList();
  log(name + ' monitoring stopped.');
}

async function pollDeviceData(name, ip) {
  const ds = deviceState[name];
  if (!ds || !ds.monitoring) return;
  const r = await proxyPi(ip, '/api/device_data?name=' + encodeURIComponent(name), {}, 'GET');
  const events = (r && r.events) || [];
  if (events.length) {
    ds.monCount = (ds.monCount || 0) + events.length;
    ds.monLast = events[events.length - 1];
  }
  const cntEl = document.getElementById('mon-count-' + name);
  const boxEl = document.getElementById('mon-box-' + name);
  if (cntEl) cntEl.textContent = String(ds.monCount || 0);
  if (boxEl && ds.monLast) boxEl.textContent = JSON.stringify(ds.monLast, null, 1);
}

// ── Video devices (rig config `video: true`): preview via the camera endpoints ──

let _videoImgRetries = {};
function videoImgError(name, img) {
  clearTimeout(_videoImgRetries[name]);
  _videoImgRetries[name] = setTimeout(() => {
    img.src = '/api/camera_feed?device=' + encodeURIComponent(name) + '&ts=' + Date.now();
  }, 1500);
}

async function startVideoStream(name) {
  const pi = getPiForDevice(name);
  if (!pi) { log(name + ' not assigned to a Pi'); return; }
  const cfg = rig.devices[name] || {};
  log('Starting ' + name + ' stream...');
  const result = await proxyPi(pi.ip, '/api/camera_preview_start', {
    device: name, type: cfg.type || name, config: cfg,
  }, 'POST');
  if (result.ok) {
    const ds = deviceState[name] = deviceState[name] || {};
    ds.streaming = true;
    renderDeviceList();
    log(name + ' stream started.');
  } else { log(name + ' stream failed: ' + (result.error || '')); }
}

async function stopVideoStream(name) {
  const pi = getPiForDevice(name);
  if (pi) await proxyPi(pi.ip, '/api/camera_preview_stop', {device: name});
  clearTimeout(_videoImgRetries[name]);
  const ds = deviceState[name] = deviceState[name] || {};
  ds.streaming = false;
  renderDeviceList();
  log(name + ' stream stopped.');
}

// ── Render ──

function renderAll() {
  renderPiList();
  renderDeviceList();
  renderDeviceCatalog();
  renderSlackSettings();
  renderShepherdSettings();
  renderDataDirs();
  if (uiBusy) _applyLockState();   // a re-render during a lock must not re-enable controls
}

// Slack notification toggle + webhook, stored on the rig (rig.slack) and saved by saveRig.
function renderSlackSettings() {
  if (!rig) return;
  rig.slack = rig.slack || {enabled: false, webhook_url: ''};
  const cb = document.getElementById('slack-enabled');
  const wh = document.getElementById('slack-webhook');
  if (cb) cb.checked = !!rig.slack.enabled;
  if (wh) wh.value = rig.slack.webhook_url || '';
}
function onSlackChange() {
  if (!rig) return;
  rig.slack = rig.slack || {};
  rig.slack.enabled = document.getElementById('slack-enabled').checked;
  rig.slack.webhook_url = document.getElementById('slack-webhook').value.trim();
}

// Shepherd process-monitor toggle, stored on the rig (rig.shepherd) and saved by saveRig.
// Applied on Install: ON enables+starts the leader shepherd service, OFF stops+disables it.
function renderShepherdSettings() {
  if (!rig) return;
  rig.shepherd = rig.shepherd || {};
  if (rig.shepherd.enabled === undefined) rig.shepherd.enabled = true;
  const cb = document.getElementById('shepherd-enabled');
  if (cb) cb.checked = !!rig.shepherd.enabled;
}
async function onShepherdChange() {
  if (!rig) return;
  rig.shepherd = rig.shepherd || {};
  const on = document.getElementById('shepherd-enabled').checked;
  rig.shepherd.enabled = on;
  // Apply live on the leader so no reinstall is needed. (Also persisted on Save Rig, and
  // re-applied by Install as the fallback if the leader is offline right now.)
  const leader = (rig.pis || []).find(p => p.role === 'leader');
  if (!leader) { log('Monitor set to ' + (on ? 'ON' : 'OFF') + ' (no leader Pi in this rig yet).'); return; }
  const r = await proxyPi(leader.ip, '/api/shepherd', {enabled: on});
  if (r && r.ok) log('Monitor ' + (on ? 'ON — shepherd running' : 'OFF — shepherd stopped') + ' on ' + leader.name + '.');
  else log('Monitor toggle saved, but not applied on ' + leader.name + ': ' + ((r && r.error) || 'unreachable') + ' (will apply on next Install).');
}

// Leader-Pi data + video directories, stored on the rig (rig.data) and saved by saveRig.
function renderDataDirs() {
  if (!rig) return;
  rig.data = rig.data || {};
  const ld = document.getElementById('data-leader-dir');
  const vd = document.getElementById('data-video-dir');
  if (ld) ld.value = rig.data.leader_dir || '';
  if (vd) vd.value = rig.data.video_dir || '';
}
function onDataDirChange() {
  if (!rig) return;
  rig.data = rig.data || {};
  rig.data.leader_dir = document.getElementById('data-leader-dir').value.trim();
  rig.data.video_dir = document.getElementById('data-video-dir').value.trim();
}

function renderPiList() {
  const el = document.getElementById('pi-list');
  if (!rig || !rig.pis.length) { el.innerHTML = '<div style="color:#666">No Pis configured</div>'; syncLogHeight(); return; }

  el.innerHTML = rig.pis.map((pi, idx) => {
    const ps = piState[pi.ip] || {};
    const dotClass = ps.checked ? (ps.ok ? 'dot-green' : 'dot-red') : 'dot-gray';
    const offline = ps.checked && !ps.ok;   // API down (red dot) -> disable API-dependent buttons
    const noSsh = ps.checked && !ps.ssh;     // SSH down -> can't even Install (Install provisions over SSH)
    return `
    <div class="pi-card">
      <div class="pi-header">
        <span class="status-dot ${dotClass}"></span>
        <strong>${pi.name}</strong>
        <span class="role-badge ${pi.role}">${pi.role}</span>
        <span style="color:#888; font-size:11px">${pi.user || 'vruser'}@${pi.ip}</span>
      </div>
      <div>
        ${(pi.devices || []).map(d =>
          `<span class="device-chip enabled">${d}</span>`
        ).join('')}
      </div>
      <div class="btn-row">
        <button class="btn btn-blue btn-sm" onclick="checkPi('${pi.ip}')">Check</button>
        <button class="btn btn-orange btn-sm" onclick="installPi(${idx})" ${noSsh ? 'disabled' : ''}>Install</button>
        <button class="btn btn-green btn-sm" onclick="deployPi(${idx})" ${offline ? 'disabled' : ''}>Deploy</button>
        <button class="btn btn-yellow btn-sm" onclick="restartPiApi(${idx})" ${offline ? 'disabled' : ''}>Restart API</button>
        <button class="btn btn-red btn-sm" onclick="rebootPi(${idx})" ${offline ? 'disabled' : ''}>Reboot</button>
        <button class="btn btn-red btn-sm" onclick="shutdownPi(${idx})" ${offline ? 'disabled' : ''}>Shutdown</button>
      </div>
    </div>`;
  }).join('');
  syncLogHeight();
}

// Keep the Log card exactly as tall as the Pis card (measured with align-items:flex-start so log
// content can't inflate it); the log then scrolls INSIDE the card. Re-run on Pi re-render and on
// window resize.
function syncLogHeight() {
  const piCard = document.getElementById('pi-list') && document.getElementById('pi-list').closest('.card');
  const logCard = document.getElementById('log') && document.getElementById('log').closest('.card');
  if (!piCard || !logCard) return;
  logCard.style.height = piCard.offsetHeight + 'px';
}
window.addEventListener('resize', syncLogHeight);

let activeDeviceTab = null;   // which device tab is currently shown
function devLabel(name) {
  const t = (rig && rig.devices && rig.devices[name] && rig.devices[name].type) || name;
  return (deviceSchemas[t] && deviceSchemas[t].label) || name;
}

function renderDeviceList() {
  const el = document.getElementById('device-list');
  if (!rig) { el.innerHTML = ''; return; }
  const pisReady = allPisOk();
  const devices = rig.devices || {};
  // Rig-yaml order (same order Initialize runs them in).
  const names = Object.keys(devices);
  if (!names.length) {
    el.innerHTML = '<div style="color:#888; font-size:12px">No devices — add one above.</div>';
    return;
  }
  if (!activeDeviceTab || !names.includes(activeDeviceTab)) activeDeviceTab = names[0];

  // Chrome-style tab strip (status dot + label; dimmed label when the device is off).
  const tabs = names.map(name => {
    const dev = devices[name];
    const ds = deviceState[name] || {};
    const dot = ds.initialized === true ? 'dot-green' : ds.initialized === false ? 'dot-red' : 'dot-gray';
    const active = name === activeDeviceTab ? ' active' : '';
    const off = (dev.enabled !== false) ? '' : ' style="opacity:0.5"';
    return `<button class="device-tab${active}" data-device="${name}" title="${devLabel(name)}"
                    onclick="switchDeviceTab('${name}')">
      <span class="status-dot ${dot}"></span><span class="device-tab-label"${off}>${name}</span>
    </button>`;
  }).join('');

  // One panel per device; only the active one is shown.
  const panels = names.map(name =>
    `<div class="device-panel" data-device="${name}" style="display:${name === activeDeviceTab ? 'block' : 'none'}">
      ${renderDeviceCard(name, devices[name], pisReady)}
    </div>`).join('');

  el.innerHTML = `<div class="device-tabs">${tabs}</div><div class="device-panels">${panels}</div>`;
}

// Switch the visible device tab in place (no full re-render, so input state is preserved).
function switchDeviceTab(name) {
  activeDeviceTab = name;
  document.querySelectorAll('#device-list .device-panel').forEach(p =>
    p.style.display = (p.dataset.device === name) ? 'block' : 'none');
  document.querySelectorAll('#device-list .device-tab').forEach(t =>
    t.classList.toggle('active', t.dataset.device === name));
}

// Update one rig-config field from the generic card editor. Decimal numbers stay numbers,
// JSON arrays parse ([1280, 720]), everything else is kept as a string — including hex
// strings like '0x68' (Number('0x68') would silently turn an i2c address into 104, which
// a device parsing int(str, 16) would then read as 0x104).
function updateDeviceField(name, key, raw) {
  if (!rig || !rig.devices[name]) return;
  let v = raw;
  const s = String(raw).trim();
  if (s !== '' && !/^0x/i.test(s) && !isNaN(Number(s))) v = Number(s);
  else { try { const j = JSON.parse(s); if (Array.isArray(j)) v = j; } catch (e) {} }
  rig.devices[name][key] = v;
}

function renderDeviceCard(name, dev, pisReady) {
  const enabled = dev.enabled !== false;
  const ds = deviceState[name] || {};
  const initDot = ds.initialized === true ? 'dot-green' : ds.initialized === false ? 'dot-red' : 'dot-gray';
  const assignHtml = (rig.pis || []).map((pi, i) => {
    const assigned = (pi.devices || []).includes(name);
    return `<span class="device-chip ${assigned ? 'enabled' : ''}"
                  onclick="assignDeviceToPi('${name}', ${i})"
                  style="cursor:pointer">${pi.name}</span>`;
  }).join('');

  const showControls = enabled && pisReady;
  const controlsHtml = showControls ? renderGenericControls(name, dev) : '';

  // Reinit lives in the header row (next to title/status) — one per device.
  const reinitBtn = showControls
    ? `<button class="btn btn-yellow btn-sm" style="margin-left:auto"
               onclick="reinitDevice('${name}')" ${devicesInitialized ? '' : 'disabled'}>Reinit</button>`
    : '';

  const opacity = pisReady ? (enabled ? 1 : 0.6) : 0.5;
  return `
    <div class="device-card" style="opacity: ${opacity}">
      <h4 style="display:flex; align-items:center; gap:6px; flex-wrap:wrap">
        <span class="status-dot ${initDot}"></span>
        <span class="device-chip ${enabled ? 'enabled' : ''}"
              onclick="toggleDevice('${name}')" style="cursor:pointer">
          ${name} ${enabled ? '(on)' : '(off)'}
        </span>
        <span style="color:#667; font-size:10px">${devLabel(name)}</span>
        ${assignHtml}
        ${reinitBtn}
      </h4>
      ${showControls ? `<fieldset class="device-fieldset" ${devicesInitialized ? '' : 'disabled'}>${controlsHtml}</fieldset>` : ''}
      ${showControls && !devicesInitialized ? '<div style="font-size:10px; color:#888; margin-top:4px">Press Initialize to enable device controls.</div>' : ''}
      ${!pisReady && enabled ? '<div style="font-size:10px; color:#f44336; margin-top:4px">Waiting for Pi check...</div>' : ''}
    </div>`;
}

// Generic card body: the device's rig-yaml fields as editable inputs (persisted by Save Rig),
// plus Live monitoring — a video device streams MJPEG, everything else streams its events into
// a JSON readout via the generic monitor endpoints.
function renderGenericControls(name, dev) {
  const ds = deviceState[name] || {};
  const fields = Object.entries(dev)
    .filter(([k, v]) => !['type', 'enabled'].includes(k)
                        && (v === null || typeof v !== 'object' || Array.isArray(v)))
    .map(([k, v]) => {
      if (typeof v === 'boolean') {
        return `<div class="device-field"><label>${k}</label>
          <input type="checkbox" ${v ? 'checked' : ''}
                 onchange="rig.devices['${name}']['${k}'] = this.checked"></div>`;
      }
      const val = Array.isArray(v) ? JSON.stringify(v) : (v ?? '');
      return `<div class="device-field"><label>${k}</label>
        <input type="text" value='${String(val).replace(/'/g, "&#39;")}'
               onchange="updateDeviceField('${name}','${k}',this.value)"></div>`;
    }).join('');

  const isVideo = !!dev.video;
  let liveHtml;
  if (isVideo) {
    const streaming = !!ds.streaming;
    const url = '/api/camera_feed?device=' + encodeURIComponent(name) + '&ts=' + Date.now();
    liveHtml = `
      <div class="device-controls" style="margin-top:6px">
        ${streaming
          ? `<button class="btn btn-red btn-sm" onclick="stopVideoStream('${name}')">Stop</button>`
          : `<button class="btn btn-blue btn-sm" onclick="startVideoStream('${name}')" ${ds.initialized !== true ? 'disabled' : ''}>Live</button>`}
      </div>
      <div class="stream-container">
        ${streaming
          ? `<img src="${url}" alt="${name} stream" onerror="videoImgError('${name}', this)">`
          : `<div class="stream-offline">OFFLINE</div>`}
      </div>`;
  } else {
    const monitoring = !!ds.monitoring;
    liveHtml = `
      <div class="device-controls" style="margin-top:6px">
        ${monitoring
          ? `<button class="btn btn-red btn-sm" onclick="stopDeviceMonitor('${name}')">Stop</button>`
          : `<button class="btn btn-blue btn-sm" onclick="startDeviceMonitor('${name}')" ${ds.initialized !== true ? 'disabled' : ''}>Live</button>`}
        ${monitoring ? `<span style="font-size:11px; color:#888">events: <span id="mon-count-${name}">${ds.monCount || 0}</span></span>` : ''}
      </div>
      ${monitoring ? `<div class="mon-box" id="mon-box-${name}">waiting for events…</div>` : ''}`;
  }

  return `
    <div class="device-controls">${fields}</div>
    <div style="font-size:10px; color:#666; margin-top:2px">Fields persist on Save Rig; Reinit applies them to the device.</div>
    ${liveHtml}`;
}

function renderDeviceCatalog() {
  const el = document.getElementById('device-catalog');
  if (!el) return;
  const entries = Object.entries(deviceSchemas)
    .sort((a, b) => (a[1].label || a[0]).localeCompare(b[1].label || b[0]));   // alphabetical
  if (!entries.length) { el.innerHTML = '<div style="color:#666">No devices defined</div>'; return; }
  const opts = entries.map(([name, s]) => {
    const inRig = (rig && rig.devices && rig.devices[name]) ? ' ✓' : '';
    return `<option value="${name}">${s.label}${inRig}</option>`;
  }).join('');
  el.innerHTML = `
    <select id="catalog-select" style="width:100%; margin-bottom:6px" onchange="updateCatalogInfo()">${opts}</select>
    <div>
      <button class="btn btn-green" onclick="addDevice()">Add Device</button>
      <button class="btn btn-red" onclick="removeDevice()">Remove Device</button>
    </div>
    <div id="catalog-info" style="font-size:10px; color:#666; margin-top:5px"></div>`;
  const sel = document.getElementById('catalog-select');
  if (sel && catalogSel && deviceSchemas[catalogSel]) sel.value = catalogSel;
  updateCatalogInfo();
}

function updateCatalogInfo() {
  const sel = document.getElementById('catalog-select');
  const info = document.getElementById('catalog-info');
  if (!sel) return;
  catalogSel = sel.value;
  const s = deviceSchemas[catalogSel];
  const inRig = (rig && rig.devices && rig.devices[catalogSel]) ? ' — already in rig' : '';
  if (info) info.textContent = s ? `${s.io_type} | ${(s.required_packages || []).join(', ')}${inRig}` : '';
}

function addDevice() {
  if (!rig) { log('Load or create a rig first.'); return; }
  const sel = document.getElementById('catalog-select');
  if (!sel || !sel.value) return;
  const name = sel.value; catalogSel = name;
  if (rig.devices[name]) { log((deviceSchemas[name] ? deviceSchemas[name].label : name) + ' is already in the rig.'); return; }
  rig.devices[name] = { type: name, enabled: true };
  log('Added ' + (deviceSchemas[name] ? deviceSchemas[name].label : name) + ' to the rig.');
  renderDeviceCatalog();
  renderAll();
}

function removeDevice() {
  if (!rig) { log('Load or create a rig first.'); return; }
  const sel = document.getElementById('catalog-select');
  if (!sel || !sel.value) return;
  const name = sel.value; catalogSel = name;
  if (!rig.devices[name]) { log((deviceSchemas[name] ? deviceSchemas[name].label : name) + ' is not in the rig.'); return; }
  if (!confirm('Remove ' + (deviceSchemas[name] ? deviceSchemas[name].label : name) + ' from the rig?\nIts config will be dropped on the next Save Rig.')) return;
  delete rig.devices[name];
  (rig.pis || []).forEach(pi => { pi.devices = (pi.devices || []).filter(d => d !== name); });
  log('Removed ' + (deviceSchemas[name] ? deviceSchemas[name].label : name) + ' from the rig.');
  renderDeviceCatalog();
  renderAll();
}

// ── Log ──

function log(msg) {
  const el = document.getElementById('log');
  const ts = new Date().toLocaleTimeString();
  el.insertAdjacentHTML('afterbegin', `<div>[${ts}] ${msg}</div>`);
  el.scrollTop = 0;
}

async function quitApp() {
  if (!confirm('Quit VRFarm Setup?')) return;
  await fetch('/api/quit', {method: 'POST'}).catch(() => {});
  document.title = 'VRFarm Setup (closed)';
  document.body.innerHTML = '<div style="text-align:center;margin-top:40vh;color:#888;font-size:16px">Server stopped. You can close this tab.</div>';
}
</script>
