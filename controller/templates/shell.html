<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VRFarm</title>
<link rel="stylesheet" href="/static/common.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  #app { display: flex; height: 100vh; }
  /* left rail: the card colour; the active tab is the panel colour with the green status accent */
  #rail { width: 150px; flex: none; background: #16213e; display: flex; flex-direction: column; }
  #rail .brand { padding: 14px 14px 10px; font-weight: 700; font-size: 18px; color: #fff; }
  #rail .brand small { display: block; font-weight: 400; font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
  .tab { padding: 16px 14px; font-size: 14px; font-weight: 600; color: #bcd; cursor: pointer; border-left: 4px solid transparent; }
  .tab:hover { background: #1c2a52; color: #fff; }
  .tab.active { background: #0f3460; color: #fff; border-left-color: #4caf50; }
  .tab .sub { display: block; font-size: 10px; font-weight: 400; color: #888; margin-top: 2px; }
  #rail .spacer { flex: 1; }
  #rail .quit { margin: 10px 14px 14px; }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  /* rig sub-tabs: the Setup page's device-tab look (chrome tabs over a panel-colour rule) */
  #substrip { display: none; align-items: flex-end; gap: 4px; padding: 8px 12px 0; background: #1a1a2e; border-bottom: 2px solid #0f3460; min-height: 42px; }
  #substrip.show { display: flex; }
  .rigtab { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; margin-bottom: -2px; border-radius: 8px 8px 0 0;
            background: #16213e; border: 1px solid #0f3460; border-bottom: none; cursor: pointer; font-size: 12px; font-weight: 600; color: #bcd; }
  .rigtab:hover { background: #1c2a52; }
  .rigtab.active { background: #0f3460; color: #fff; }
  .rigtab .x { color: #888; font-size: 12px; padding: 0 2px; font-weight: 400; }
  .rigtab .x:hover { color: #f44336; }
  .rigtab .info { font-size: 10px; font-weight: 400; color: #888; font-family: monospace; }
  #loadmenu { position: relative; margin: 0 0 6px 8px; }
  #loadmenu .menu { display: none; position: absolute; top: 28px; left: 0; background: #16213e; border: 1px solid #0f3460; border-radius: 6px;
                    min-width: 220px; z-index: 20; padding: 4px 0; box-shadow: 0 6px 20px rgba(0,0,0,0.5); }
  #loadmenu.open .menu { display: block; }
  .menu .hdr { padding: 5px 12px 3px; font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
  .menu .item { padding: 5px 12px; cursor: pointer; font-size: 12px; color: #e0e0e0; display: flex; justify-content: space-between; gap: 12px; }
  .menu .item:hover { background: #0f3460; }
  .menu .item small { color: #888; }
  #substrip-hint { margin: 0 0 8px 10px; }
  #frames { flex: 1; position: relative; min-height: 0; }
  #frames iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; background: #1a1a2e; }
  #frames iframe.hidden { visibility: hidden; }
  #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #888; font-size: 14px; }
  #toast { position: fixed; bottom: 14px; right: 14px; background: #c62828; color: #fff; padding: 8px 12px; border-radius: 4px;
           font-size: 12px; display: none; z-index: 60; max-width: 420px; }
</style>
</head>
<body>
<div id="app">
  <div id="rail">
    <div class="brand">VRFarm <small id="brand-sub">controller</small></div>
    <div class="tab" data-tab="network" onclick="showTab('network')">Network<span class="sub">rigs, Pis, groups</span></div>
    <div class="tab" data-tab="setup" onclick="showTab('setup')">Setup<span class="sub">devices, install, calibrate</span></div>
    <div class="tab" data-tab="experiment" onclick="showTab('experiment')">Experiment<span class="sub">deploy, go, live</span></div>
    <div class="tab" data-tab="data" onclick="showTab('data')">Data<span class="sub">sync, purge, power off</span></div>
    <div class="spacer"></div>
    <div id="fleet-summary" class="muted" style="padding:0 12px 8px"></div>
    <button class="btn btn-sm btn-red quit" onclick="quitApp()" title="Stop the controller server">Quit server</button>
  </div>
  <div id="main">
    <div id="substrip">
      <span id="rigtabs" style="display:flex; gap:4px; align-items:flex-end"></span>
      <div id="loadmenu">
        <button class="btn btn-sm btn-blue" onclick="toggleLoadMenu(event)">Load rig ▾</button>
        <div class="menu" id="loadmenu-items"></div>
      </div>
      <span class="muted" id="substrip-hint" style="margin-left:10px"></span>
    </div>
    <div id="frames"><div id="empty">Pick a tab on the left.</div></div>
  </div>
</div>
<div id="toast"></div>
<script src="/static/shell.js"></script>
</body>
</html>
