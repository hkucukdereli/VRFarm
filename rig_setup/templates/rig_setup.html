<!DOCTYPE html><html><head>
<meta charset="utf-8">
<title>VRFarm — Rig Setup</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'SF Mono', Consolas, monospace; background: #111827;
       color: #e0e0e0; font-size: 14px; padding: 20px; max-width: 1100px; margin: 0 auto; }
h1 { color: #60a5fa; font-size: 20px; margin-bottom: 4px; }
.subtitle { color: #6b7280; font-size: 12px; margin-bottom: 20px; }
.card { background: #1f2937; border: 1px solid #374151; border-radius: 8px;
        padding: 16px; margin-bottom: 16px; }
h3 { font-size: 11px; text-transform: uppercase; color: #60a5fa;
     letter-spacing: 1px; margin-bottom: 12px; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11px; color: #6b7280; padding: 6px 8px;
     border-bottom: 1px solid #374151; }
td { padding: 8px; border-bottom: 1px solid #1f2937; vertical-align: middle; }
input, select { background: #111827; border: 1px solid #374151; color: #e0e0e0;
                padding: 5px 8px; border-radius: 4px; font-family: inherit;
                font-size: 12px; }
input[type=text] { width: 100%; }
.btn { padding: 7px 14px; border: none; border-radius: 4px; cursor: pointer;
       font-family: inherit; font-size: 12px; font-weight: bold;
       transition: opacity 0.15s; }
.btn:hover { opacity: 0.85; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-blue   { background: #2563eb; color: white; }
.btn-green  { background: #16a34a; color: white; }
.btn-red    { background: #dc2626; color: white; }
.btn-gray   { background: #374151; color: #ccc; }
.btn-amber  { background: #d97706; color: white; }
.btn-purple { background: #7c3aed; color: white; }
.btn-sm     { padding: 4px 10px; font-size: 11px; }
.row-btns   { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.status     { display: inline-block; padding: 2px 8px; border-radius: 10px;
              font-size: 11px; font-weight: bold; white-space: nowrap; }
.st-ok      { background: #14532d; color: #4ade80; }
.st-err     { background: #7f1d1d; color: #f87171; }
.st-unknown { background: #1f2937; color: #6b7280; }
.st-busy    { background: #1e3a5f; color: #60a5fa; }
.st-installed { background: #14532d; color: #4ade80; }
.st-deployed  { background: #14532d; color: #4ade80; }
.log        { font-size: 11px; font-family: monospace; max-height: 300px;
              overflow-y: auto; background: #0d1117; border: 1px solid #374151;
              border-radius: 4px; padding: 10px; }
.log-ok   { color: #4ade80; }
.log-err  { color: #f87171; }
.log-warn { color: #fbbf24; }
.log-info { color: #94a3b8; }
.actions  { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.rig-bar  { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.rig-bar select { font-size: 13px; padding: 6px 10px; min-width: 160px; }
.rig-bar input  { font-size: 13px; padding: 6px 10px; }
.rig-path { font-size: 12px; color: #6b7280; background: #111827;
            border: 1px solid #374151; border-radius: 4px; padding: 5px 8px;
            font-family: inherit; min-width: 220px; }
.tooltip  { position: relative; cursor: help; }
.tooltip:hover::after { content: attr(data-tip); position: absolute; bottom: 120%;
  left: 50%; transform: translateX(-50%); background: #374151; color: #e0e0e0;
  padding: 4px 8px; border-radius: 4px; font-size: 11px; white-space: nowrap;
  z-index: 10; }
.hidden { display: none; }
</style>
</head><body>
<h1>VRFarm — Rig Setup</h1>
<p class="subtitle">Manage rigs, install packages, deploy code, initialize hardware</p>

<!-- Rig selector -->
<div class="card">
  <h3>Rig</h3>
  <div class="rig-bar">
    <select id="rig-select" onchange="switchRig(this.value)">
      <option value="">— select rig —</option>
    </select>
    <button class="btn btn-green btn-sm" onclick="promptNewRig()">+ New Rig</button>
    <button class="btn btn-red btn-sm" onclick="deleteRig()" id="btn-delete-rig" disabled>Delete Rig</button>
    <span style="color:#374151">|</span>
    <button class="btn btn-gray btn-sm" onclick="document.getElementById('file-load').click()">Load JSON</button>
    <input type="file" id="file-load" accept=".json" style="display:none" onchange="loadRigFile(event)">
    <input type="text" id="rig-path-box" class="rig-path" readonly value="" placeholder="no rig loaded">
    <button class="btn btn-blue btn-sm" onclick="saveCurrentRig()" id="btn-save" disabled>Save</button>
  </div>
</div>

<!-- Pi table (hidden until rig loaded) -->
<div class="card hidden" id="pi-section">
  <h3>Pi Computers — <span id="rig-label" style="color:#e0e0e0;text-transform:none"></span></h3>
  <table>
    <tr>
      <th>Name</th><th>IP address</th><th>User</th><th>Role</th>
      <th>SSH</th><th>Packages</th><th>Files</th><th>Actions</th>
    </tr>
    <tbody id="pi-table"></tbody>
  </table>
  <div class="actions">
    <button class="btn btn-gray btn-sm" onclick="addPi()">+ Add Pi</button>
    <span style="color:#374151">|</span>
    <button class="btn btn-green btn-sm" onclick="testAll()">Test All SSH</button>
    <button class="btn btn-blue btn-sm" onclick="installAll()">Install All</button>
    <button class="btn btn-blue btn-sm" onclick="deployAll()">Deploy All</button>
    <span style="color:#374151">|</span>
    <button class="btn btn-purple btn-sm" onclick="generateWarpMap()" id="btn-warp">
      Generate Warp Map (stim)</button>
  </div>
</div>

<!-- Log -->
<div class="card">
  <h3>Setup Log</h3>
  <div class="log" id="log-box"><span class="log-info">Waiting...</span></div>
</div>

<script>
let currentRig = null;   // rig name
let rigData    = null;   // full rig object

// ── Rig management ─────────────────────────────────────────────────────────

function updatePathBox() {
  const box = document.getElementById('rig-path-box');
  if (currentRig) {
    box.value = `/config/rig_${currentRig}.json`;
  } else {
    box.value = '';
    box.placeholder = 'no rig loaded';
  }
}

function refreshRigList(selectName) {
  fetch('/api/rigs').then(r => r.json()).then(d => {
    const sel = document.getElementById('rig-select');
    sel.innerHTML = '<option value="">— select rig —</option>';
    d.rigs.forEach(name => {
      const opt = document.createElement('option');
      opt.value = name; opt.textContent = name;
      if (name === selectName) opt.selected = true;
      sel.appendChild(opt);
    });
    if (selectName) switchRig(selectName);
  });
}

function switchRig(name) {
  if (!name) {
    currentRig = null; rigData = null;
    document.getElementById('pi-section').classList.add('hidden');
    document.getElementById('btn-delete-rig').disabled = true;
    document.getElementById('btn-save').disabled = true;
    updatePathBox();
    return;
  }
  fetch(`/api/rig/${name}`).then(r => r.json()).then(d => {
    if (d.error) { appendLog({msg: d.error, cls: 'err'}); return; }
    currentRig = name;
    rigData = d;
    document.getElementById('rig-label').textContent = name;
    document.getElementById('pi-section').classList.remove('hidden');
    document.getElementById('btn-delete-rig').disabled = false;
    document.getElementById('btn-save').disabled = false;
    updatePathBox();
    renderTable();
  });
}

function promptNewRig() {
  const name = prompt('New rig name (e.g., "gouda"):');
  if (!name) return;
  const clean = name.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
  if (!clean) { alert('Invalid name — use letters, numbers, underscores'); return; }
  fetch('/api/rig/new', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name: clean})
  }).then(r => r.json()).then(d => {
    if (d.error) { alert(d.error); return; }
    refreshRigList(clean);
  });
}

function deleteRig() {
  if (!currentRig) return;
  if (!confirm(`Delete rig "${currentRig}"? This removes rig_${currentRig}.json.`)) return;
  fetch(`/api/rig/${currentRig}`, {method: 'DELETE'}).then(r => r.json()).then(d => {
    if (d.ok) {
      currentRig = null; rigData = null;
      document.getElementById('pi-section').classList.add('hidden');
      updatePathBox();
      refreshRigList(null);
    }
  });
}

function loadRigFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      const name = data.name || file.name.replace(/^rig_/, '').replace(/\.json$/, '');
      const clean = name.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
      if (!clean) { alert('Could not determine rig name from file'); return; }
      // Ensure Pi entries have install/deploy fields
      (data.pis || []).forEach(pi => {
        if (pi.installed === undefined) pi.installed = false;
        if (pi.installed_at === undefined) pi.installed_at = null;
        if (pi.deployed === undefined) pi.deployed = false;
        if (pi.deployed_at === undefined) pi.deployed_at = null;
        if (pi.status === undefined) pi.status = 'unknown';
      });
      fetch(`/api/rig/${clean}`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
      }).then(r => r.json()).then(d => {
        if (d.ok) refreshRigList(clean);
      });
    } catch (err) {
      alert('Invalid JSON file: ' + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function saveCurrentRig() {
  if (!currentRig || !rigData) return;
  syncFromInputs();
  fetch(`/api/rig/${currentRig}`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(rigData)
  }).then(r => r.json()).then(d => {
    if (d.ok) appendLog({msg: `Rig "${currentRig}" saved`, cls: 'ok'});
  });
}

// ── Pi table ───────────────────────────────────────────────────────────────

function syncFromInputs() {
  if (!rigData) return;
  rigData.pis.forEach((pi, i) => {
    const row = document.getElementById(`pi-row-${i}`);
    if (!row) return;
    const inputs = row.querySelectorAll('input[type=text]');
    if (inputs[0]) pi.name = inputs[0].value;
    if (inputs[1]) pi.ip   = inputs[1].value;
    if (inputs[2]) pi.user = inputs[2].value;
    const sel = row.querySelector('select');
    if (sel) pi.role = sel.value;
  });
}

function renderTable() {
  if (!rigData) return;
  const tbody = document.getElementById('pi-table');
  tbody.innerHTML = '';
  rigData.pis.forEach((pi, i) => {
    const st = pi.status || 'unknown';
    const stCls = st === 'ok' ? 'st-ok' : st === 'error' ? 'st-err' : st === 'busy' ? 'st-busy' : 'st-unknown';

    // Package status
    let pkgLabel, pkgCls;
    if (pi.installed) {
      pkgLabel = 'installed';
      pkgCls = 'st-installed';
    } else {
      pkgLabel = 'not installed';
      pkgCls = 'st-unknown';
    }

    // Deploy status
    let depLabel, depCls;
    if (pi.deployed) {
      depLabel = 'deployed';
      depCls = 'st-deployed';
    } else {
      depLabel = 'not deployed';
      depCls = 'st-unknown';
    }

    const hasRole = !!pi.role;

    // Install button: gray/disabled if no role, blue "Install" if not installed, red "Reset" if installed
    let installBtnCls, installBtnLabel, installBtnTitle, installDisabled;
    if (!hasRole) {
      installBtnCls = 'btn-gray'; installBtnLabel = 'Install';
      installBtnTitle = 'Select a role first'; installDisabled = true;
    } else if (pi.installed) {
      installBtnCls = 'btn-red'; installBtnLabel = 'Reset';
      installBtnTitle = 'Reset: re-run apt + pip install'; installDisabled = false;
    } else {
      installBtnCls = 'btn-blue'; installBtnLabel = 'Install';
      installBtnTitle = 'Install system + pip packages'; installDisabled = false;
    }

    // Deploy button: gray/disabled if no role or not installed, blue "Deploy" if installed,
    // red "Redeploy" if already deployed
    let deployBtnCls, deployBtnLabel, deployBtnTitle, deployDisabled;
    if (!hasRole || !pi.installed) {
      deployBtnCls = 'btn-gray'; deployBtnLabel = 'Deploy';
      deployBtnTitle = !hasRole ? 'Select a role first' : 'Install packages first';
      deployDisabled = true;
    } else if (pi.deployed) {
      deployBtnCls = 'btn-red'; deployBtnLabel = 'Redeploy';
      deployBtnTitle = 'Redeploy: re-transfer files + reinit hardware';
      deployDisabled = false;
    } else {
      deployBtnCls = 'btn-blue'; deployBtnLabel = 'Deploy';
      deployBtnTitle = 'Deploy code + init hardware'; deployDisabled = false;
    }

    // Check button: disabled if no role
    const checkDisabled = !hasRole;

    const tr = document.createElement('tr');
    tr.id = `pi-row-${i}`;
    tr.innerHTML = `
      <td><input type="text" value="${pi.name}" style="width:120px"></td>
      <td><input type="text" value="${pi.ip}"   style="width:140px"></td>
      <td><input type="text" value="${pi.user || 'vruser'}" style="width:70px"></td>
      <td><select>
        <option value=""        ${!pi.role             ? 'selected':''}>—</option>
        <option value="stim"    ${pi.role==='stim'    ? 'selected':''}>stim</option>
        <option value="control" ${pi.role==='control' ? 'selected':''}>control</option>
      </select></td>
      <td><span class="status ${stCls}">${st}</span></td>
      <td>
        <span class="status ${pkgCls} tooltip" data-tip="${pi.installed_at ? 'Installed ' + pi.installed_at : 'Never installed'}">${pkgLabel}</span>
      </td>
      <td>
        <span class="status ${depCls} tooltip" data-tip="${pi.deployed_at ? 'Deployed ' + pi.deployed_at : 'Never deployed'}">${depLabel}</span>
      </td>
      <td class="row-btns">
        <button class="btn btn-gray btn-sm" onclick="testOne(${i})">SSH</button>
        <button class="btn ${installBtnCls} btn-sm"
                onclick="installOne(${i})"
                ${installDisabled ? 'disabled' : ''}
                title="${installBtnTitle}"
                >${installBtnLabel}</button>
        <button class="btn ${deployBtnCls} btn-sm"
                onclick="deployOne(${i})"
                ${deployDisabled ? 'disabled' : ''}
                title="${deployBtnTitle}"
                >${deployBtnLabel}</button>
        <button class="btn btn-gray btn-sm" onclick="checkInstalled(${i})"
                ${checkDisabled ? 'disabled' : ''}
                title="${checkDisabled ? 'Select a role first' : 'Check packages + files'}">Check</button>
        <button class="btn btn-red btn-sm" onclick="removePi(${i})">Remove</button>
      </td>`;
    tbody.appendChild(tr);
  });
}

function addPi() {
  if (!rigData) return;
  syncFromInputs();
  rigData.pis.push({
    name: '', ip: '192.168.10.', user: 'vruser', role: '',
    status: 'unknown', installed: false, installed_at: null,
    deployed: false, deployed_at: null
  });
  renderTable();
}

function removePi(i) {
  if (!rigData) return;
  const pi = rigData.pis[i];
  if (pi.name && !confirm(`Remove "${pi.name}" from rig?`)) return;
  syncFromInputs();
  rigData.pis.splice(i, 1);
  renderTable();
}

// ── Pi actions ─────────────────────────────────────────────────────────────

function getPi(i) {
  syncFromInputs();
  return rigData.pis[i];
}

function testOne(i) {
  const pi = getPi(i);
  pi.status = 'busy'; renderTable();
  fetch('/api/test', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({pi})}).then(r => r.json()).then(d => {
    pi.status = d.ok ? 'ok' : 'error'; renderTable();
    appendLog({msg: d.ok ? `${pi.name}: SSH OK — ${d.info}` : `${pi.name}: ${d.error}`,
               cls: d.ok ? 'ok' : 'err'});
  });
}

function requireRole(pi) {
  if (!pi.role) {
    appendLog({msg: `${pi.name || 'Pi'}: must select a role (stim/control) first`, cls: 'err'});
    return false;
  }
  return true;
}

function installOne(i) {
  const pi = getPi(i);
  if (!requireRole(pi)) return;
  if (pi.installed && !confirm(`Reset ${pi.name}?\nThis will re-run apt + pip install on the Pi.`)) return;
  saveCurrentRig();
  pi.status = 'busy'; renderTable();
  appendLog({msg: `Installing packages on ${pi.name} (${pi.role})...`, cls: 'info'});
  fetch('/api/install', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({pi, rig_name: currentRig})}).then(r => r.json()).then(d => {
    // Status updates come via SSE log; reload rig after a delay to pick up saved state
    setTimeout(() => switchRig(currentRig), 3000);
  });
}

function deployOne(i) {
  const pi = getPi(i);
  if (!requireRole(pi)) return;
  if (pi.deployed) {
    if (!confirm(`Files already deployed to ${pi.name}.\nRedeploy? This will overwrite files and reinit hardware.`)) return;
  }
  saveCurrentRig();
  pi.status = 'busy'; renderTable();
  appendLog({msg: `Deploying to ${pi.name} (${pi.role})...`, cls: 'info'});
  fetch('/api/deploy', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({pi, rig_name: currentRig})}).then(r => r.json()).then(d => {
    setTimeout(() => switchRig(currentRig), 3000);
  });
}

function checkInstalled(i) {
  const pi = getPi(i);
  if (!requireRole(pi)) return;
  appendLog({msg: `Checking ${pi.name}...`, cls: 'info'});
  // Check packages and files in parallel
  const checkPkgs = fetch('/api/check_installed', {method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({pi})}).then(r => r.json());
  const checkFiles = fetch('/api/check_deployed', {method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({pi})}).then(r => r.json());

  Promise.all([checkPkgs, checkFiles]).then(([pkgRes, fileRes]) => {
    const det = pkgRes.details || {};
    const parts = [];
    parts.push(`conda: ${det.conda_env ? 'OK' : 'MISSING'}`);
    parts.push(`apt: ${det.system_pkgs ? 'OK' : 'MISSING'}`);
    parts.push(`pip: ${det.pip_pkgs ? 'OK' : 'MISSING'}`);
    parts.push(`files: ${fileRes.files_found ? fileRes.files_found.length : 0}/${fileRes.files_expected ? fileRes.files_expected.length : '?'}`);

    pi.installed = pkgRes.installed;
    if (pi.installed) pi.installed_at = pi.installed_at || 'pre-existing';
    pi.deployed = fileRes.all_present || false;
    if (pi.deployed) pi.deployed_at = pi.deployed_at || 'pre-existing';
    // Also update SSH status (if check worked, SSH is ok)
    pi.status = 'ok';

    appendLog({msg: `${pi.name}: ${parts.join(', ')}`,
               cls: (pkgRes.installed && fileRes.all_present) ? 'ok' : 'warn'});
    renderTable();
  }).catch(err => {
    pi.status = 'error';
    appendLog({msg: `${pi.name}: check failed — ${err}`, cls: 'err'});
    renderTable();
  });
}

function testAll()   { rigData.pis.forEach((_, i) => testOne(i)); }
function installAll(){ rigData.pis.forEach((_, i) => installOne(i)); }
function deployAll() { rigData.pis.forEach((pi, i) => { if (pi.installed) deployOne(i); }); }

function generateWarpMap() {
  if (!rigData) return;
  const stim = rigData.pis.find(p => p.role === 'stim');
  if (!stim) { appendLog({msg: 'No stim Pi defined', cls: 'err'}); return; }
  const btn = document.getElementById('btn-warp');
  btn.disabled = true; btn.textContent = 'Generating...';
  appendLog({msg: `Generating warp map on ${stim.name} (${stim.ip}) — 2-5 min...`, cls: 'info'});
  fetch('/api/warp_map', {method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({pi: stim})})
  .then(r => r.json()).then(d => {
    btn.disabled = false; btn.textContent = 'Generate Warp Map (stim)';
    if (d.ok) appendLog({msg: 'Warp map generated', cls: 'ok'});
    else      appendLog({msg: 'Warp map failed: ' + d.error, cls: 'err'});
  });
}

// ── SSE log stream ─────────────────────────────────────────────────────────

const es = new EventSource('/stream');
es.onmessage = e => appendLog(JSON.parse(e.data));

function appendLog(d) {
  const box = document.getElementById('log-box');
  const cls = {ok:'log-ok', err:'log-err', warn:'log-warn', info:'log-info'}[d.cls] || 'log-info';
  const div = document.createElement('div');
  div.className = cls;
  div.textContent = `[${d.t || new Date().toLocaleTimeString()}] ${d.msg}`;
  box.prepend(div);
  if (box.children.length > 300) box.removeChild(box.lastChild);
}

// ── Init ───────────────────────────────────────────────────────────────────

refreshRigList(null);
</script>
</body></html>
