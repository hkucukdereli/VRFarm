# attention_blocked.yaml
#
# Multi-location blocked attention task. Days 9+ (attention & expert).
#
# Days 9-10 (Attention reintro):
#   Level 2, max_lick 0.45, 12 deg stim, single contrast.
#   Override: block_size 35, block_sequence [80,-40,40,-80], n_trials 140.
#
# Days 11+ (Expert):
#   Level 2.5, max_lick 0.3, stim shrinks 8->6->4 deg, contrasts added.
#   Switch trials: first trial of each new block uses lowest contrast.
#   Defaults below are expert params.
#
# Typical expert:
#   150 trials, 6x25 blocks, [80,-40,40,-80,80,-40]
#   4 deg stim, contrasts [0.25, 0.15, 0.125] in 33/33/33
#   ITI 4-16s, max_lick 0.3

paradigm: attention
version: 1

states:
  iti:
    duration:
      random: [4, 16]
    events:
      lick:
        - condition: "lick_count > max_licks"
          action: restart_iti
    on_timeout: stimulus

  stimulus:
    duration: 0.6
    entry_actions:
      - show_stim
    events:
      lick:
        - condition: "level == 1 and not rewarded"
          action: deliver_reward
    on_timeout: response_window

  response_window:
    duration: 1.4
    entry_actions:
      - auto_reward
    events:
      lick:
        - condition: "level == 3 and is_go and not rewarded"
          action: deliver_reward
          transition: outcome
    on_timeout: outcome

  outcome:
    duration: 0.5
    entry_actions:
      - record_trial
    on_timeout: iti

stimulus:
  size_deg: 4.0
  duration_s: 2.0
  altitude_deg: 10.0
  go_rule: all
  contrast:
    values: [0.25, 0.15, 0.125]
    proportions: [0.34, 0.33, 0.33]
  switch_trial_contrast: lowest

timing:
  reward_delay_s: 0.6

session:
  n_trials: 150
  block_size: 25
  block_sequence: [80, -40, 40, -80, 80, -40]

levels:
  2:
    description: "Conditioning - free reward at 0.6s"
  2.5:
    description: "Adaptive - probabilistic L2/L3 per trial"

adaptive:
  enabled: true
  initial_state: 0.0
  step_up: 0.2
  step_down: 0.2

devices:
  lick_sensor:
    max_lick_rate: 0.3
  reward:
    amount_ul: 4.0
  display:
    background_gray: 0.5
