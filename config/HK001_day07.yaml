# config/HK001_day07.yaml
# Experiment protocol config — no subject/date/session info.
# Subject, date, and session number are set in the experiment UI.

notes: "Day1"

rig:
  name: "cheese"

session:
  level: 1
  n_trials: 150
  block_size: 25
  block_sequence: [80, -40, 40, -80, 80, -40]

stimulus:
  size_deg: 8.0
  duration_s: 2.0
  background_gray: 0.0        # PsychoPy -1..1, 0 = mid-gray
  altitude_deg: 10.0
  contrast:
    values: [0.25, 0.15, 0.125]
    proportions: [0.33, 0.33, 0.33]

timing:
  iti_range_s: [8, 16]
  response_window_s: 6.5
  reward_delay_s: 0.6

hardware:
  use_stim: true
  use_reward: true
  use_licks: true
  use_camera: false
  use_photodiode: false

lick:
  max_lick_rate: 0.3

adaptive:
  enabled: true
  initial_state: 0.0
  step_up: 0.2
  step_down: 0.2

reward:
  amount_ul: 4.0
