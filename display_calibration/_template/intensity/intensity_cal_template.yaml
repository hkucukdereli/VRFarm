# TEMPLATE — display_calibration/<rig>/intensity/intensity_cal_<YYYYmmdd_HHMM>.yaml
# Measured in Setup → Display → INTENSITY → Measure, at ONE altitude: one column per azimuth you
# choose, light vs drive 1.0 .. 0.0 (0.0 = black floor). Two columns minimum, three or more out to
# the screen edge recommended. The rig uses the file named by devices.display.intensity_calibration.
# Mock files (source: theoretical / none) use the same format with two levels per column.
kind: intensity
version: 1
source: measured            # measured | theoretical | none
timestamp: '2026-01-01T12:00:00'
method: manual              # manual | auto (PM100D)
unit: lux
alt_deg: 20.0
patch:
  shape: square
  size_deg: 15.0
  bg_gray: 0
  apply_lum: false          # measured raw: no correction while calibrating
level_sweeps:
- az_deg: 0.0
  measurements:
  - {level: 1.0, reading: 225.0}
  - {level: 0.5, reading: 50.0}
  - {level: 0.2, reading: 6.0}
  - {level: 0.0, reading: 0.8}
- az_deg: 40.0
  measurements:
  - {level: 1.0, reading: 103.0}
  - {level: 0.5, reading: 24.0}
  - {level: 0.2, reading: 3.5}
  - {level: 0.0, reading: 0.45}
- az_deg: 80.0
  measurements:
  - {level: 1.0, reading: 51.0}
  - {level: 0.5, reading: 11.6}
  - {level: 0.2, reading: 1.7}
  - {level: 0.0, reading: 0.2}
