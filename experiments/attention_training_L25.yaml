last_saved: "2026-04-08"
# Adaptive. Days 6-8. Single location.
# Probabilistic mix of L2 (free) and L3 (operant).

# ── What to show ──
stimulus:
  background_gray: 0.5
  size_deg: 8.0
  duration_s: 2.0
  altitude_deg: 10.0
  go_rule: all
  contrast:
    values: [1.0]
    proportions: [1]

# ── When to reward ──
reward:
  amount_ul: 4.0
  level: 2.5
  reward_delay_s: 0.6
  response_window: 1.4
  timeout_rule: rate
  max_lick_rate: 0.3

# ── Trial structure ──
session:
  n_blocks: 1
  block_size: 150
  block_sequence: [80]
  iti: [8, 16]
  prestim_duration: 0
  poststim_duration: 0
  global_delay: 0
  block_delay: 0
  block_delay_skip_first: false

# ── Adaptive (level 2.5 only) ──
adaptive:
  enabled: true
  initial_state: 0.0
  step_up: 0.2
  step_down: 0.2
